<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Draw</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Draw">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* minimal by instruction: purely functional, no stylistic embellishment */
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
html,body{width:100%;height:100%;overflow:hidden;background:#141414;color:#e8e6e1;
  font:14px system-ui,sans-serif;touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
body{position:fixed;inset:0}
.screen{padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button,select,input{font:inherit;padding:8px 12px;border:1px solid #555;
  background:#1e1e1e;color:#e8e6e1}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}
.grow{flex:1}
/* screen 2: format preview */
#fmtPrev{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fmtCanvas{max-width:100%;max-height:100%}
/* screen 3: main view */
#viewport{flex:1;min-height:0;position:relative;overflow:hidden;background:#2a2a2a}
/* gallery: every photo ever opened, newest first */
#gallery{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:8px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:8px;align-content:start}
.gitem{border:1px solid #555;background:#1e1e1e;padding:4px;cursor:pointer}
.gitem img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.gbar{height:4px;background:#333;margin-top:4px;visibility:hidden}
.gitem.busy .gbar{visibility:visible}
.gfill{height:100%;width:0;background:#e8e6e1}
#calBox{width:96px;height:96px;border:1px dashed #888;flex:none}
#calSlide{flex:1;min-width:80px;padding:0}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#refImg,#gridCv,#selCv,#paperCv,#dimCv,#flashCv,#doneCv{position:absolute;left:0;top:0}
/* compare: the photographed drawing aligned over the reference */
#cmpView{flex:1;min-height:0;position:relative;overflow:hidden;background:#2a2a2a}
#cmpCv{position:absolute;left:0;top:0;touch-action:none}
#camVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  display:none;background:#000}
/* the tool panel floats bottom-left over the canvas and can be dismissed */
#hudWrap{position:absolute;left:calc(8px + env(safe-area-inset-left));
  bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  max-width:calc(100% - 16px)}
#hud{border:1px solid #555;background:#161616}
#hudToggle{width:44px;height:44px;padding:0;font-size:18px;line-height:1}
#camCorner{position:absolute;right:calc(8px + env(safe-area-inset-right));
  bottom:calc(8px + env(safe-area-inset-bottom));z-index:5}
#compareBtn{width:44px;height:44px;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center}
#stat{padding:4px 8px;font-size:12px;min-height:22px}
.fsBtn{min-width:40px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="tonePaint" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feColorMatrix id="toneMatrix" type="matrix"
      values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  1 0 0 0 0"/>
  </filter>
</defs></svg>

<!-- 1: upload -->
<div class="screen on" id="scrUpload">
  <div class="row"><span>Reference photo</span><span class="grow"></span>
    <button class="fsBtn" title="Fullscreen">&#x26F6;</button></div>
  <div class="row"><input type="file" id="file" accept="image/*"></div>
  <div class="row"><span id="upStat"></span></div>
  <div id="gallery"></div>
</div>

<!-- 2: format -->
<div class="screen" id="scrFormat">
  <div class="row">
    <label>Aspect
      <select id="aspect">
        <option value="photo">photo's own</option>
        <option value="2:3">2:3</option>
        <option value="3:4">3:4</option>
        <option value="4:5">4:5</option>
        <option value="1:1">1:1</option>
      </select>
    </label>
    <label>Width (in)
      <select id="widthIn"></select>
    </label>
    <span id="fmtInfo"></span>
  </div>
  <div id="fmtPrev"><canvas id="fmtCanvas"></canvas></div>
  <div class="row">
    <span>true size &mdash; match this box to a real 1" with a ruler:</span>
    <div id="calBox"></div>
    <input type="range" id="calSlide" min="60" max="220" value="100">
  </div>
  <div class="row">
    <button id="fmtBack">Back</button>
    <span class="grow"></span>
    <button id="fmtGo">Continue</button>
  </div>
</div>

<!-- 3: main -->
<div class="screen" id="scrMain">
  <div id="viewport">
    <div id="world">
      <canvas id="refImg"></canvas>
      <!-- exposure comes up square by square as plans land -->
      <canvas id="dimCv"></canvas>
      <!-- squares being actively worked on flash gently -->
      <canvas id="flashCv"></canvas>
      <canvas id="paperCv"></canvas>
      <!-- done-marks above the paper, inverse of what's beneath like the grid -->
      <canvas id="doneCv" style="mix-blend-mode:difference"></canvas>
      <!-- grid above the paper, inverse of whatever is beneath - the studio's rule -->
      <canvas id="gridCv" style="mix-blend-mode:difference"></canvas>
      <canvas id="selCv"></canvas>
    </div>
  </div>
  <div id="hudWrap">
    <div id="hud">
      <div id="stat"></div>
      <div class="row">
        <select id="blockN">
          <option value="1">1 square</option>
          <option value="2">2 x 2</option>
          <option value="3">3 x 3</option>
        </select>
        <button id="drawBtn" disabled>Draw</button>
        <button id="stepBtn" disabled>Step</button>
        <button id="clearBtn" disabled>Clear</button>
        <button id="doneBtn" disabled>Mark done</button>
        <span class="grow"></span>
        <button id="reformat">Format</button>
        <button class="fsBtn" title="Fullscreen">&#x26F6;</button>
      </div>
    </div>
    <button id="hudToggle" title="Tools">&#x25BE;</button>
  </div>
  <!-- compare lives behind the camera in the opposite corner -->
  <div id="camCorner"><button id="compareBtn" title="Compare"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 19.5V7.5h4.2l1.8-2.2h6l1.8 2.2H21v12z"/><circle cx="12" cy="13.3" r="3.4"/></svg></button></div>
</div>

<!-- 4: compare - photograph the real drawing, align it, flip against the reference -->
<div class="screen" id="scrCompare">
  <div id="cmpView"><canvas id="cmpCv"></canvas>
    <video id="camVid" playsinline autoplay muted></video></div>
  <div class="row">
    <input type="file" id="cmpFile" accept="image/*" hidden>
    <button id="cmpShoot">Photo</button>
    <button id="cmpFlip" disabled>Flip view</button>
    <button id="cmpCorn" disabled>Corners</button>
    <span id="cmpHint" class="grow"></span>
    <button id="cmpBack">Back</button>
  </div>
</div>

<script>
window.__INLINE_ARSENAL = [{"id": 30, "name": "Fingertip", "mode": "deposit", "tone": 15, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 15.6, "fuzz": 50, "spacing": 6, "pSize": false, "liftCeiling": 78}, {"id": 12, "name": "Q-tip", "mode": "deposit", "tone": 15, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 5, "fuzz": 50, "spacing": 6, "pSize": false, "noEngine": true}, {"id": 24, "name": "Very Light Big Brush", "mode": "deposit", "tone": 192, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 23, "name": "Light Big Brush", "mode": "deposit", "tone": 110, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 70, "spacing": 6, "pSize": false}, {"id": 21, "name": "Big Brush", "mode": "deposit", "tone": 66, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 74, "spacing": 6, "pSize": false}, {"id": 29, "name": "Dark Big", "mode": "deposit", "tone": 40, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 29.9, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 14, "name": "Big Blend", "mode": "blend", "tone": 128, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 26, "name": "Light Med", "mode": "deposit", "tone": 120, "liftAmount": 20, "blendType": "directional", "spreadMm": 10, "strength": 60, "lighten": 0, "sizeMm": 9.1, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 25, "name": "Med Brush", "mode": "deposit", "tone": 78, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 67, "lighten": 0, "sizeMm": 9.1, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 28, "name": "Dark Med", "mode": "deposit", "tone": 43, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 7, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 27, "name": "Med Blend", "mode": "blend", "tone": 128, "liftAmount": 20, "blendType": "spread", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 7, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 16, "name": "Kneaded Eraser", "mode": "lift", "tone": 128, "liftAmount": 20, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 9.1, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 17, "name": "Tissue", "mode": "lift", "tone": 128, "liftAmount": 15, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 20.9, "fuzz": 50, "spacing": 6, "pSize": false}];
window.__WORKER_SRC = "window = self;\nwindow.__INLINE_ENGINE_SRC = \"\\ufeff\\n\\n\\nconst ASSET = {\\n  W: 0.30,          // element radius as a fraction of the finest tool's width\\n  CONTRAST: 45,     // \\\"very very\\\": how far off its own surround a shape must sit\\n  _cache: new Map(),\\n\\n  \\n  morph(src, RW, r, isMax){\\n    const s=Math.max(1,Math.round(r*0.65)), d=Math.max(1,Math.round(r*0.45));\\n    const pick = isMax ? Math.max : Math.min;\\n    let a=src, tmp=new Float64Array(src.length), out=new Float64Array(src.length);\\n    for (let y=0;y<RW;y++) for (let x=0;x<RW;x++){\\n      let v=a[y*RW+x];\\n      for (let k=-s;k<=s;k++){ const xx=x+k; if(xx<0||xx>=RW) continue; v=pick(v,a[y*RW+xx]); }\\n      tmp[y*RW+x]=v;\\n    }\\n    for (let y=0;y<RW;y++) for (let x=0;x<RW;x++){\\n      let v=tmp[y*RW+x];\\n      for (let k=-s;k<=s;k++){ const yy=y+k; if(yy<0||yy>=RW) continue; v=pick(v,tmp[yy*RW+x]); }\\n      out[y*RW+x]=v;\\n    }\\n    for (let i=0;i<d;i++){\\n      const prev=out; out=new Float64Array(prev.length);\\n      for (let y=0;y<RW;y++) for (let x=0;x<RW;x++){\\n        const p=y*RW+x; let v=prev[p];\\n        if (x>0)    v=pick(v,prev[p-1]);\\n        if (x<RW-1) v=pick(v,prev[p+1]);\\n        if (y>0)    v=pick(v,prev[p-RW]);\\n        if (y<RW-1) v=pick(v,prev[p+RW]);\\n        out[p]=v;\\n      }\\n    }\\n    return out;\\n  },\\n\\n  \\n  defer(ref, RW, toolIn){\\n    const r = Math.max(2, Math.round(this.W * toolIn * RW));\\n    const eroded  = this.morph(ref,     RW, r, false);\\n    const opened  = this.morph(eroded,  RW, r, true);    // bright thin things gone\\n    const dilated = this.morph(ref,     RW, r, true);\\n    const closed  = this.morph(dilated, RW, r, false);   // dark  thin things gone\\n    \\n    const s=[]; for (let i=0;i<ref.length;i+=7) s.push(ref[i]);\\n    s.sort((a,b)=>a-b);\\n    const range = s[Math.floor(s.length*0.97)] - s[Math.floor(s.length*0.03)];\\n    const bar = Math.max(16, Math.min(this.CONTRAST, range*0.42));\\n    const out = new Float64Array(ref.length);\\n    let n=0;\\n    for (let i=0;i<ref.length;i++){\\n      const white = ref[i]-opened[i];       // >0 on a bright thin shape\\n      const black = closed[i]-ref[i];       // >0 on a dark   thin shape\\n      if (white > bar){ out[i]=opened[i]; n++; }\\n      else if (black > bar){ out[i]=closed[i]; n++; }\\n      else out[i]=ref[i];\\n    }\\n    out.deferredFraction = n/ref.length;\\n    return out;\\n  },\\n\\n  \\n  forCell(ref, RW, toolIn, cell){\\n    const key = cell ? `${cell[0]},${cell[1]},${RW}` : null;\\n    if (key && this._cache.has(key)) return this._cache.get(key);\\n    const f = this.defer(ref, RW, toolIn);\\n    if (key){ if (this._cache.size>40) this._cache.clear(); this._cache.set(key,f); }\\n    return f;\\n  }\\n};\\n\\n\\n\\nconst RUNBESTS = {};\\nconst COSTHIST = new Int32Array(256);   // scratch for cost()'s percentiles\\n\\nconst SQCACHE = {};\\nconst SQKEYS = [];\\nconst ENGINE = {\\nname: 'v11 assets',\\nversion: 11,\\nASSET,\\n\\nnext: async function(ctx){\\n  \\n  const GENT=globalThis.GENT||(globalThis.GENT={region:0,fill:0,along:0,extreme:0,blur:0,calls:0});\\n  GENT.calls++;\\n\\n  const RW=ctx.RW, T=ctx.tools, ref=ctx.ref, paper=ctx.paper;\\n  \\n  const FINEST = (()=>{ let f=1e9;\\n    for (const t of Object.values(T)) if (t.mode==='deposit') f=Math.min(f,t.sizeMm/25.4);\\n    return f===1e9 ? 0.197 : f; })();\\n  const CAL = FINEST/0.197;\\n  const WIDEST = (()=>{ let w=0;\\n    for (const t of Object.values(T)) if (t.mode==='deposit') w=Math.max(w,t.sizeMm);\\n    return w||30; })();\\n  const SQKEY = (()=>{ let h=0;\\n    for (let i=0;i<16;i++) h=(h*31 + (ref[(i*15731)%ref.length]|0))|0;\\n    return (ctx.cell?ctx.cell.join(','):'?')+'|'+RW+'|'+FINEST.toFixed(4)+'|'+h; })();\\n  const SQ = SQCACHE[SQKEY] || (()=>{ const o={blurs:{}};\\n    SQCACHE[SQKEY]=o; SQKEYS.push(SQKEY);\\n    if (SQKEYS.length>64) delete SQCACHE[SQKEYS.shift()];\\n    return o; })();\\n nnected area wants to be darker than it is\\n  const massField = blurC(6);        // the field a stroked mass follows\\n  \\n  for (const t of deposits){\\n    if (t.tone >= pm-4) continue;\\n    \\n    const above = deposits.filter(d=>d.tone>t.tone).reduce((a,d)=>d.tone<a?d.tone:a, 255);\\n    const below = deposits.filter(d=>d.tone<t.tone).reduce((a,d)=>d.tone>a?d.tone:a, 0);\\n    const hi = (t.tone+above)/2, lo = (t.tone+below)/2;\\n    const reg = region(p => target[p] < hi && target[p] >= lo && (paper[p]-target[p]) > 8);\\n    if (!reg || reg.area < 0.015) continue;\\n    \\n    if (reg.area < 0.85 && !edgeOnForm(reg)) continue;\\n    \\n    const ramp = pts => pts.map(q=>{\\n      const px=Math.round(Math.min(1,Math.max(0,q[0]))*(RW-1)),\\n            py=Math.round(Math.min(1,Math.max(0,q[1]))*(RW-1));\\n      const i2=py*RW+px;\\n      const need=paper[i2]-target[i2];          // how much darker it must get\\n      const room=paper[i2]-t.tone;              // how much this tool could darken\\n      const f=room>1 ? need/room : 0;\\n      return [q[0], q[1], Math.max(0.12, Math.min(1, f))];\\n    });\\n    const p2 = fill(reg, inches(t), null, t.tone, massField);\\n    if (p2) cands.push({tool:t.name, path:ramp(p2), stage:'mass', area:reg.area,\\n      why:`band: ${Math.round(reg.area*100)}% of the square sits in ${t.name}'s value band `\\n        + `(${Math.round(lo)}-${Math.round(hi)}), laid as a ramp so it continues`});\\n    const ride = fill(reg, inches(t), null, t.tone, massField, true);\\n    if (ride) cands.push({tool:t.name, path:ramp(ride), stage:'mass', area:reg.area,\\n      why:`band: the same value band as one tapered stroke along its form`});\\n  }\\n\\n  for (const slack of [18,10]){\\n    const reg=region(p=>(paper[p]-target[p])>slack);\\n    if (!reg||reg.area<0.02) continue;\\n    for (const t of deposits){\\n      // aim at the DARK end of the region, not its middle: the light within it\\n      // is going to be carved back out with the er <script>
/* GPU.JS - the WebGPU audition engine. SPEED.md phase: full port, gated.

   The spike proved the shape: 256 auditions x 16K px in 3.2ms, bit-matching
   JS (96x). This file carries the real thing: rehearsal (deposit AND lift
   with the stain clamp) plus ALL FOUR cost terms, per candidate, in one
   dispatch. It integrates NOWHERE until gpuSelfTest() passes parity against
   the worker's own arithmetic - the engine's judgment must not move.

   API (all no-ops if WebGPU is absent):
     await gpuInit()                       -> true if a device is live
     gpuLoadSquare({paper,tgt,tgx,tgy,stain,tdark})  Float32Array fields at RW
     await gpuScoreBatch(cands)            -> Float32Array of costs
       cand: {stamps:[[x,y,r,amp]..], mode:0|1, tone, lift}   (RW pixel space)
     await gpuSelfTest()                   -> {ok, worst}  vs the JS mirror

   Integration plan (next): engine gains ctx.tryMarkBatch; the decision loop
   collects candidates, scores them here, rehearses ONLY the winner on CPU
   for the paper update. Fallback: the existing per-candidate worker path.

   NOT DONE YET (in order):
   - histogram percentile terms (shortfall/blown) - kernel scaffold below
     computes the two histograms with atomics; the percentile walk + combine
     still happens on CPU from the binned readback (cheap: 2x256 u32 per cand).
   - blends stay CPU (canvas-shaped physics).
   - parity harness wiring into the worker (compare vs cost() on live squares).
*/
'use strict';

const GPUK = (() => {
  const MAXS = 48;                     // stamps per candidate (path dabs)
  let device=null, pipe=null, RWg=0;
  let bufs=null, uB=null;

  const WGSL = (RW) => `
  struct U { n:u32, pix:u32, rw:u32, maxs:u32, tthr:f32, pad0:u32, pad1:u32, pad2:u32 };
  @group(0) @binding(0) var<storage,read> paper:array<f32>;
  @group(0) @binding(1) var<storage,read> tgt:array<f32>;
  @group(0) @binding(2) var<storage,read> tg:array<f32>;       // gx at i, gy at i+pix
  @group(0) @binding(3) var<storage,read> stain:array<f32>;
  @group(0) @binding(4) var<storage,read> stamps:array<f32>;   // [c][s][x,y,r,amp]
  @group(0) @binding(5) var<storage,read> cmeta:array<f32>;     // [c][mode,tone,lift,scount]
  @group(0) @binding(6) var<storage,read_write> terms:array<f32>; // [c][tone,steps,mis,mw]
  @group(0) @binding(7) var<storage,read_write> hist:array<atomic<u32>>; // [c][2][256]
  @group(0) @binding(8) var<uniform> u:U;
  var<workgroup> shA:array<f32,256>;
  var<workgroup> shB:array<f32,256>;
  var<workgroup> shC:array<f32,256>;
  var<workgroup> shD:array<f32,256>;
  var<workgroup> shE:array<f32,256>;
  var<workgroup> shF:array<f32,256>;

  fn rehearse(c:u32, i:u32) -> f32 {
    let x=f32(i % u.rw); let y=f32(i / u.rw);
    let m=c*4u;
    let mode=cmeta[m]; let tone=cmeta[m+1u]; let lift=cmeta[m+2u];
    let k=u32(cmeta[m+3u]);
    var a:f32=0.0;
    for (var s:u32=0u; s<k; s=s+1u){
      let o=(c*u.maxs+s)*4u;
      let dx=x-stamps[o]; let dy=y-stamps[o+1u]; let r=stamps[o+2u];
      let amp=stamps[o+3u];
      let d=sqrt(dx*dx+dy*dy)/max(r,0.5);
      if (d<1.0){
        let core=0.5; var av:f32=1.0;
        if (d>core){ let uu=(d-core)/(1.0-core); av=1.0-(uu*uu*(3.0-2.0*uu)); }
        a=max(a, av*min(amp,1.0));
      }
    }
    let v=paper[i];
    if (mode<0.5){                                   // deposit
      return (1.0-a)*v + a*min(v,tone);
    }
    return min(min(255.0, v+lift*a), stain[i]);     // lift, stain-clamped
  }

  @compute @workgroup_size(256)
  fn main(@builtin(workgroup_id) wg:vec3<u32>, @builtin(local_invocation_id) li:vec3<u32>){
    let c=wg.x; let t=li.x;
    var tAcc:f32=0.0; var sAcc:f32=0.0; var mAcc:f32=0.0; var wAcc:f32=0.0;
    var dAcc:f32=0.0; var dMax:f32=0.0;
    for (var i:u32=t; i<u.pix; i=i+256u){
      let vv=rehearse(c,i);
      let dp=abs(vv-paper[i]); dAcc=dAcc+dp; dMax=max(dMax,dp);
      let df=vv-tgt[i];
      tAcc=tAcc+select(-df*1.12, df, df>0.0);
      // structure grid: odd x,y in [3,RW-4] - matches the CPU stride exactly
      let x=i % u.rw; let y=i / u.rw;
      if ((x&1u)==1u && (y&1u)==1u && x>=3u && x<=u.rw-4u && y>=3u && y<=u.rw-4u){

        let pgy=rehearse(c,i+3u*u.rw)-rehearse(c,i-3u*u.rw);

        let gp=abs(pgx)+abs(pgy); let gt=abs(gx)+abs(gy);

        let tm=sqrt(gx*gx+gy*gy);
        if (tm>u.tthr){
          let pm=sqrt(pgx*pgx+pgy*pgy);
          var cs:f32=0.0;
          if (pm>1e-6){ cs=abs(pgx*gx+pgy*gy)/(pm*tm); }
          mAcc=mAcc+tm*(1.0-min(1.0,cs)); wAcc=wAcc+tm;
        }
      }
      // histograms, every 7th pixel - matches the CPU sampling exactly
      if ((i % 7u)==0u){
        let vb=u32(clamp(vv,0.0,255.0));
        atomicAdd(&hist[(c*2u)*256u+vb], 1u);
        let ob=u32(clamp(vv-tgt[i],0.0,255.0));
        atomicAdd(&hist[(c*2u+1u)*256u+ob], 1u);
      }

    shA[t]=tAcc; shB[t]=sAcc; shC[t]=mAcc; shD[t]=wAcc; shE[t]=dAcc; shF[t]=dMax; workgroupBarrier();
    var st:u32=128u;
    loop{ if (st==0u){break;}
      if (t<st){ shA[t]+=shA[t+st]; shB[t]+=shB[t+st]; shC[t]+=shC[t+st]; shD[t]+=shD[t+st];

  async function gpuInit(){

      const ad=await navigator.gpu.requestAdapter();
      if (!ad) return false;

  function mk(arr, usage){

      tgt:   mk(F32(f.tgt),   GPUBufferUsage.STORAGE),
      tg:    (()=>{ const g=new Float32Array(f.paper.length*2);

      stamps:device.createBuffer({size:N_MAX*MAXS*4*4, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST}),
      meta:  device.createBuffer({size:N_MAX*4*4,      usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST}),
      terms: device.createBuffer({size:N_MAX*8*4,      usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),
      hist:  device.createBuffer({size:N_MAX*2*256*4,  usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),
      readT: device.createBuffer({size:N_MAX*8*4,      usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),
      readH: device.createBuffer({size:N_MAX*2*256*4,  usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),
    };
    uB=mk(new ArrayBuffer(32), GPUBufferUsage.UNIFORM);   // filled per batch
    const mod=device.createShaderModule({code:WGSL(RWg)});
    pipe=device.createComputePipeline({layout:'auto', compute:{module:mod, entryPoint:'main'}});
    fieldsLoaded=true;
  }

  async function gpuScoreBatch(cands, tthr){
    if (!fieldsLoaded || !cands.length) return null;
    const N=Math.min(cands.length, N_MAX);
    const stamps=new Float32Array(N*MAXS*4), meta=new Float32Array(N*4);
    for (let c=0;c<N;c++){
      const cd=cands[c], k=Math.min(cd.stamps.length, MAXS);
      meta[c*4]=cd.mode; meta[c*4+1]=cd.tone||0; meta[c*4+2]=cd.lift||0; meta[c*4+3]=k;
      for (let s=0;s<k;s++){
        const o=(c*MAXS+s)*4, q=cd.stamps[s];
        stamps[o]=q[0]; stamps[o+1]=q[1]; stamps[o+2]=q[2]; stamps[o+3]=q[3]==null?1:q[3];
      }
    }
    device.queue.writeBuffer(bufs.stamps,0,stamps);
    device.queue.writeBuffer(bufs.meta,0,meta);
    const uv=new ArrayBuffer(32); const u32=new Uint32Array(uv); const f32=new Float32Array(uv);
    u32[0]=N; u32[1]=RWg*RWg; u32[2]=RWg; u32[3]=MAXS; f32[4]=tthr||8;
    device.queue.writeBuffer(uB,0,uv);
    // zero the histograms
    device.queue.writeBuffer(bufs.hist,0,new Uint32Array(N*2*256));
    const bg=device.createBindGroup({layout:pipe.getBindGroupLayout(0), entries:[
      {binding:0,resource:{buffer:bufs.paper}},{binding:1,resource:{buffer:bufs.tgt}},
      {binding:2,resource:{buffer:bufs.tg}},{binding:3,resource:{buffer:bufs.stain}},
      {binding:4,resource:{buffer:bufs.stamps}},{binding:5,resource:{buffer:bufs.meta}},
      {binding:6,resource:{buffer:bufs.terms}},{binding:7,resource:{buffer:bufs.hist}},
      {binding:8,resource:{buffer:uB}}]});
    const enc=device.createCommandEncoder();
    const p=enc.beginComputePass(); p.setPipeline(pipe); p.setBindGroup(0,bg);
    p.dispatchWorkgroups(N); p.end();
    enc.copyBufferToBuffer(bufs.terms,0,bufs.readT,0,N*8*4);
    enc.copyBufferToBuffer(bufs.hist,0,bufs.readH,0,N*2*256*4);
    device.queue.submit([enc.finish()]);
    await bufs.readT.mapAsync(GPUMapMode.READ);
    const terms=new Float32Array(bufs.readT.getMappedRange().slice(0,N*8*4)); bufs.readT.unmap();
    await bufs.readH.mapAsync(GPUMapMode.READ);
    const hist=new Uint32Array(bufs.readH.getMappedRange().slice(0,N*2*256*4)); bufs.readH.unmap();
    return {terms, hist, N};
  }

  function gpuUpdatePaper(paper){
    if (!fieldsLoaded) return;
    const F32=paper instanceof Float32Array?paper:Float32Array.from(paper);
    device.queue.writeBuffer(bufs.paper,0,F32);
  }

<script>

'use strict';
const SURF = 1024, PAPER_TONE = 230, RW = 256;
const MM_PER_IN = 25.4, PX_PER_MM = SURF / MM_PER_IN;
let GRID_COLS = 20, GRID_ROWS = 30;          // set by the format screen
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const state = { img:null, tools:[], refKey:'user' };

const newCanvas = () => (typeof document!=='undefined')
  ? document.createElement('canvas') : new OffscreenCanvas(1,1);
const tipCache = new Map();
const scratch = new Map();
const _rehBuf = new Float64Array(RW*RW);
const _pairBuf = new Float64Array(RW*RW);
const NBCACHE = {};
let _foCanvas=null, _foCtx=null;         // fieldOf's reusable readback canvas


function makeSurface(canvasEl, overlayEl, size){
  const SZ = size || SURF;
  canvasEl.width = canvasEl.height = SZ;
  if (overlayEl) overlayEl.width = overlayEl.height = SZ;
  const mask = newCanvas(); mask.width = mask.height = SZ;
  
  const stain = newCanvas(); stain.width=stain.height=SZ;
  const sctx = stain.getContext('2d', {willReadFrequently:true});
  sctx.fillStyle = `rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`;
  sctx.fillRect(0,0,SZ,SZ);
  const surf = {
    el: canvasEl, ctx: canvasEl.getContext('2d', {willReadFrequently:true}),
    ov: overlayEl || null, ovCtx: overlayEl ? overlayEl.getContext('2d') : null,
    mask, maskCtx: mask.getContext('2d'), drawing: null,
    stain, stainCtx: sctx,
    size: SZ, pxPerMm: SZ / MM_PER_IN
  };
  canvasEl.__surf = surf;      // a copy of these pixels can find their stain
  return surf;
}

function clearSurface(s){
  const c = s.ctx;
  c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation='source-over';
  c.filter='none'; c.globalAlpha=1;
  c.fillStyle = `rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`;
  c.fillRect(0,0,(s.size||SURF),(s.size||SURF));
  if (s.stainCtx){                      // fresh paper carries no stain
    s.stainCtx.globalCompositeOperation='source-over';
    s.stainCtx.fillStyle = `rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`;
    s.stainCtx.fillRect(0,0,(s.size||SURF),(s.size||SURF));
  }
}

function snapshot(s){
  const c = newCanvas(); c.width=c.height=(s.size||SURF);
  c.getContext('2d').drawImage(s.el,0,0); return c;
}

function meanOf(s){
  const d = s.ctx.getImageData(0,0,(s.size||SURF),(s.size||SURF)).data;
  let t=0; for (let i=0;i<d.length;i+=4) t+=d[i];
  return +(t/((s.size||SURF)*(s.size||SURF))).toFixed(2);
}

function getTip(radiusPx, fuzz01, amp){
  const key = radiusPx.toFixed(1)+'|'+fuzz01.toFixed(2)+'|'+amp.toFixed(2);
  const hit = tipCache.get(key); if (hit) return hit;
  const r = Math.max(0.5, radiusPx), d = Math.max(2, Math.ceil(r*2)+2);
  const c = newCanvas(); c.width=c.height=d;
  const g = c.getContext('2d'), cx = d/2;
  g.fillStyle='#000'; g.fillRect(0,0,d,d);
  const core = clamp(1-fuzz01, 0, 1);
  const grad = g.createRadialGradient(cx,cx,0,cx,cx,r);
  for (let i=0;i<=32;i++){
    const t=i/32; let a;
    if (t<=core) a=1; else { const u=(t-core)/Math.max(1e-6,1-core); a=1-(u*u*(3-2*u)); }
    const v = Math.round(255*a*amp);
    grad.addColorStop(t, `rgb(${v},${v},${v})`);
  }
  g.fillStyle=grad; g.beginPath(); g.arc(cx,cx,r,0,Math.PI*2); g.fill();
  if (tipCache.size>160) tipCache.clear();
  tipCache.set(key,c); return c;
}

function stamp(s,x,y,radiusPx,fuzz01,amp){
  if (amp<=0.002 || radiusPx<=0) return;
  const tip = getTip(radiusPx, fuzz01, Math.min(1,amp)), d = tip.width;
  s.maskCtx.globalCompositeOperation='lighten';
  s.maskCtx.drawImage(tip, x-d/2, y-d/2);
  s.maskCtx.globalCompositeOperation='source-over';
}

function setPassPaint(tone255, alphaScale){
  const t=(tone255/255).toFixed(5), a=alphaScale.toFixed(5);
  toneMatrix.setAttribute('values', `0 0 0 0 ${t}  0 0 0 0 ${t}  0 0 0 0 ${t}  ${a} 0 0 0 0`);
}

function getScratch(k,w,h){
  let c = scratch.get(k);
  if (!c || c.width!==w || c.height!==h){ c=newCanvas(); c.width=w; c.height=h; scratch.set(k,c); }
  return c;
}

function edgeClamp(ctx, src, pad, size){
  ctx.drawImage(src, pad, pad);
  ctx.drawImage(src, 0,0, size,1,        pad,0,        size,pad);
  ctx.drawImage(src, 0,size-1, size,1,   pad,pad+size, size,pad);
  ctx.drawImage(src, 0,0, 1,size,        0,pad,        pad,size);
  ctx.drawImage(src, size-1,0, 1,size,   pad+size,pad, pad,size);
  ctx.drawImage(src, 0,0,1,1,            0,0,          pad,pad);
  ctx.drawImage(src, size-1,0,1,1,       pad+size,0,   pad,pad);
  ctx.drawImage(src, 0,size-1,1,1,       0,pad+size,   pad,pad);
  ctx.drawImage(src, size-1,size-1,1,1,  pad+size,pad+size, pad,pad);
}

function rebuildBlend(s){
  const d = s.drawing, t = d.tool, c = s.ctx;
  c.setTransform(1,0,0,1,0,0); c.filter='none'; c.globalAlpha=1;
  c.globalCompositeOperation='copy'; c.drawImage(d.base,0,0);
  const rPx = Math.max(0.5, t.spreadMm*(s.pxPerMm||PX_PER_MM));
  const pad = Math.min(320, Math.ceil(rPx*2)+2);
  const P = getScratch('pad', (s.size||SURF)+2*pad, (s.size||SURF)+2*pad), pc = P.getContext('2d');
  pc.setTransform(1,0,0,1,0,0); pc.filter='none'; pc.globalAlpha=1;
  pc.globalCompositeOperation='source-over'; pc.clearRect(0,0,P.width,P.height);
  edgeClamp(pc, d.base, pad, (s.size||SURF));
  const B = getScratch('blend', (s.size||SURF), (s.size||SURF)), bc = B.getContext('2d');
  bc.setTransform(1,0,0,1,0,0); bc.globalAlpha=1; bc.globalCompositeOperation='copy';
  if (t.blendType === 'directional'){
    
    bc.filter='none'; bc.drawImage(P,-pad,-pad);
    bc.globalCompositeOperation='source-over';
    const trail = (d.trail && d.trail.length) ? d.trail
                : [{x:d.lastX, y:d.lastY, dx:d.dirX, dy:d.dirY}];
    
    const footR = Math.max(rPx, (t.sizeMm*(s.pxPerMm||PX_PER_MM))/2) * 1.2;
    const STEPS = 6;
    for (const s0 of trail){
      bc.save();
      bc.beginPath(); bc.arc(s0.x, s0.y, footR, 0, Math.PI*2); bc.clip();
      for (let i=1;i<=STEPS;i++){
        bc.globalAlpha = 1/(i+1);
        // sample from behind: the layer is shifted FORWARD, so what was behind
        // this point arrives at it - material moves the way the stroke moves
        bc.drawImage(P, -pad + s0.dx*rPx*i/STEPS, -pad + s0.dy*rPx*i/STEPS);
      }
      bc.restore();
    }
    bc.globalAlpha=1;
  } else {
    bc.filter = `blur(${rPx.toFixed(2)}px)`; bc.drawImage(P,-pad,-pad); bc.filter='none';
  }
  
  const lighten = +(t.lighten ?? 0);
  if (lighten > 0){
    bc.globalCompositeOperation='lighter';
    bc.fillStyle = `rgba(255,255,255,${clamp(lighten/255,0,1).toFixed(4)})`;
    bc.fillRect(0,0,(s.size||SURF),(s.size||SURF));
    bc.globalCompositeOperation='source-over';
  }
  setPassPaint(0, clamp(t.strength/100, 0, 1));
  bc.globalCompositeOperation='destination-in';
  bc.filter='url(#tonePaint)'; bc.drawImage(s.mask,0,0); bc.filter='none';
  bc.globalCompositeOperation='source-over';
  c.globalCompositeOperation='source-over'; c.drawImage(B,0,0);
}

function rebuildPass(s){
  const d = s.drawing; if (!d) return;
  if (d.mode === 'blend') return rebuildBlend(s);
  
  if (d.mode === 'depositblend'){
    const save = d.mode;
    d.mode = 'deposit'; rebuildPass(s);        // lay the tone
    d.mode = save;
    const base = d.base;                        // blend reads from base, so re-seed it
    const nb = newCanvas(); nb.width=nb.height=(s.size||SURF);
    nb.getContext('2d').drawImage(s.el || s.ctx.canvas, 0, 0);
    d.base = nb; rebuildBlend(s); d.base = base;
    return;
  }
  const c = s.ctx;
  c.setTransform(1,0,0,1,0,0); c.filter='none'; c.globalAlpha=1;
  c.globalCompositeOperation='copy'; c.drawImage(d.base,0,0);
  if (d.mode === 'lift'){
    setPassPaint(d.amount, 1);
    c.globalCompositeOperation='lighter';
    c.filter='url(#tonePaint)'; c.drawImage(s.mask,0,0); c.filter='none';
    
    c.globalCompositeOperation='darken';
    if (s.stain) c.drawImage(s.stain,0,0);
    else { c.fillStyle = `rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`;
           c.fillRect(0,0,(s.size||SURF),(s.size||SURF)); }
  } else {
    setPassPaint(d.tone, 1);
    c.globalCompositeOperation='darken';
    c.filter='url(#tonePaint)'; c.drawImage(s.mask,0,0); c.filter='none';
    
    const ceil = d.tool && d.tool.liftCeiling;
    if (ceil!=null && s.stainCtx){
      const sc=s.stainCtx;
      setPassPaint(ceil, 1);
      sc.globalCompositeOperation='darken';
      sc.filter='url(#tonePaint)'; sc.drawImage(s.mask,0,0); sc.filter='none';
      sc.globalCompositeOperation='source-over';
    }
  }
  c.globalCompositeOperation='source-over';
}

function beginPass(s, tool, tone, amount){
  s.maskCtx.globalCompositeOperation='source-over';
  s.maskCtx.fillStyle='#000'; s.maskCtx.fillRect(0,0,(s.size||SURF),(s.size||SURF));
  s.drawing = { tool, mode: tool.mode, base: snapshot(s),
                tone: tone ?? tool.tone, amount: amount ?? tool.liftAmount,
                lastX:0, lastY:0, lastP:1, residue:0, dirX:0, dirY:0, started:false };
}

function dab(s,t,x,y,pressure){
  const rBase = (t.sizeMm*(s.pxPerMm||PX_PER_MM))/2;
  stamp(s, x, y, t.pSize ? rBase*Math.max(0.05,pressure) : rBase, t.fuzz/100, pressure);
}

function segment(s,t,d,x,y,pressure){
  const rBase = (t.sizeMm*(s.pxPerMm||PX_PER_MM))/2;
  const step = Math.max(0.6, (rBase*2)*(t.spacing/100));
  const dx=x-d.lastX, dy=y-d.lastY, dist=Math.hypot(dx,dy);
  if (dist===0) return;
  const ux=dx/dist, uy=dy/dist, sm=0.35;
  d.dirX += (ux-d.dirX)*sm; d.dirY += (uy-d.dirY)*sm;
  const dl=Math.hypot(d.dirX,d.dirY)||1; d.dirX/=dl; d.dirY/=dl;
  
  if (t.mode==='blend' || t.mode==='depositblend'){
    d.trail = d.trail || [];
    const gap = Math.max(2, rBase*0.5);
    const last = d.trail[d.trail.length-1];
    if (!last || Math.hypot(x-last.x, y-last.y) >= gap)
      d.trail.push({x, y, dx:d.dirX, dy:d.dirY});
  }
  let travelled = -d.residue;
  while (travelled + step <= dist){
    travelled += step;
    const f=travelled/dist;
    dab(s, t, d.lastX+ux*travelled, d.lastY+uy*travelled, d.lastP+(pressure-d.lastP)*f);
  }
  d.residue = dist - travelled;
  d.lastX=x; d.lastY=y; d.lastP=pressure;
}

function fieldOf(canvasOrCtxSource, outBuf){
  if (!_foCanvas){ _foCanvas=newCanvas(); _foCanvas.width=_foCanvas.height=RW;
    _foCtx=_foCanvas.getContext('2d',{willReadFrequently:true}); _foCtx.imageSmoothingQuality='high'; }
  _foCtx.globalCompositeOperation='copy';
  _foCtx.drawImage(canvasOrCtxSource,0,0,RW,RW);
  _foCtx.globalCompositeOperation='source-over';
  const d = _foCtx.getImageData(0,0,RW,RW).data;
  const out = outBuf || new Float64Array(RW*RW);
  
  for (let i=0,p=0;i<d.length;i+=4,p++) out[p]=d[i];
  return out;
}

function blurField(src, sigmaPx){
  const c=newCanvas(); c.width=c.height=RW;
  const g=c.getContext('2d',{willReadFrequently:true});
  const im=g.createImageData(RW,RW);
  for (let p=0,i=0;p<src.length;p++,i+=4){
    const v=clamp(Math.round(src[p]),0,255);
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  g.putImageData(im,0,0);
  const c2=newCanvas(); c2.width=c2.height=RW;
  const g2=c2.getContext('2d',{willReadFrequently:true});
  g2.filter=`blur(${sigmaPx}px)`; g2.drawImage(c,0,0); g2.filter='none';
  const d2=g2.getImageData(0,0,RW,RW).data;
  const out=new Float64Array(RW*RW);
  for (let p=0,i=0;p<out.length;p++,i+=4) out[p]=d2[i];
  return out;
}

function carryStain(surf, srcEl){
  const src = srcEl && srcEl.__surf;
  const sc = surf.stainCtx; if (!sc) return;
  sc.globalCompositeOperation='copy';
  if (src && src.stain) sc.drawImage(src.stain,0,0,(surf.size||SURF),(surf.size||SURF));
  else { sc.fillStyle=`rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`;
         sc.fillRect(0,0,(surf.size||SURF),(surf.size||SURF)); }
  sc.globalCompositeOperation='source-over';
}

function layOn(surf, srcEl, m){
  const t = state.tools.find(x=>x.name===m.tool);
  const pts = m.path||[];
  if (!t || !pts.length) return false;
  const c = surf.ctx;
  c.setTransform(1,0,0,1,0,0); c.filter='none'; c.globalAlpha=1;
  if (srcEl){ c.globalCompositeOperation='copy'; c.drawImage(srcEl,0,0,(surf.size||SURF),(surf.size||SURF));
    carryStain(surf, srcEl); }
  c.globalCompositeOperation='source-over';
  const eff = Object.assign({}, t, m.size ? {sizeMm:m.size*MM_PER_IN} : {});
  const SZ = surf.size || SURF;                 // the surface decides the scale
  beginPass(surf, eff, m.tone, m.lift);
  const prL = q => q.length>2 && q[2]!=null ? q[2] : 1;
  surf.drawing.lastX=pts[0][0]*SZ; surf.drawing.lastY=pts[0][1]*SZ; surf.drawing.lastP=prL(pts[0]);
  dab(surf, eff, pts[0][0]*SZ, pts[0][1]*SZ, prL(pts[0]));
  for (let i=1;i<pts.length;i++) segment(surf, eff, surf.drawing, pts[i][0]*SZ, pts[i][1]*SZ, prL(pts[i]));
  rebuildPass(surf);
  surf.drawing = null;
  return true;
}

function cellNeighborhood(cc,rr){
  const key=state.refKey+'|'+cc+','+rr;
  if (NBCACHE[key]) return NBCACHE[key];
  const cw=state.img.width/GRID_COLS, ch=state.img.height/GRID_ROWS;
  const x0=Math.max(0,(cc-1))*cw, y0=Math.max(0,(rr-1))*ch;
  const x1=Math.min(GRID_COLS,cc+2)*cw, y1=Math.min(GRID_ROWS,rr+2)*ch;
  const q=newCanvas(); q.width=q.height=RW;
  const g=q.getContext('2d',{willReadFrequently:true}); g.imageSmoothingQuality='high';
  
  const winW=3*cw, winH=3*ch;
  const ox=((cc-1)*cw-x0)/winW*RW, oy=((rr-1)*ch-y0)/winH*RW;
  g.fillStyle='rgb(230,230,230)'; g.fillRect(0,0,RW,RW);
  g.drawImage(state.img, x0,y0,x1-x0,y1-y0, -ox,-oy,(x1-x0)/winW*RW,(y1-y0)/winH*RW);
  const d=g.getImageData(0,0,RW,RW).data;
  const win=new Float64Array(RW*RW); let mean=0;
  for (let i=0,p2=0;i<d.length;i+=4,p2++){ win[p2]=d[i]; mean+=d[i]; }
  mean/=win.length;
  
  const SIG=Math.round(RW*0.35/3);
  const low=blurField(win,SIG);
  const centerLow=new Float64Array(RW*RW);
  for (let y=0;y<RW;y++) for (let x=0;x<RW;x++){
    const wx=Math.min(RW-1,Math.round((1+x/(RW-1))*RW/3)),
          wy=Math.min(RW-1,Math.round((1+y/(RW-1))*RW/3));
    centerLow[y*RW+x]=low[wy*RW+wx];
  }
  
  const SIGMID=Math.round(RW*0.9/3);
  const lowMid=blurField(win,SIGMID);
  const midLow=new Float64Array(RW*RW);
  for (let y=0;y<RW;y++) for (let x=0;x<RW;x++){
    const wx=Math.min(RW-1,Math.round((1+x/(RW-1))*RW/3)),
          wy=Math.min(RW-1,Math.round((1+y/(RW-1))*RW/3));
    midLow[y*RW+x]=lowMid[wy*RW+wx];
  }
  const out={groundTone:mean, centerLow, midLow};
  NBCACHE[key]=out; return out;
}

function engineTools(){
  return Object.fromEntries(state.tools.filter(t=>!t.noEngine).map(t=>[t.name,t]));
}

</script>
<script>

const RUN_HOOKS = {
  abort: bg => false,             // throw away the current background run?
  pause: async bg => {},          // wait while the user's hands are on the page
  err:  (bg, err) => { console.warn('engine error', err); }
};

let ENG=null, mine=null, rehearsalEl=null, rehearsal=null;


let GROUND=null, G_SPAN=0, G_OX=0, G_OY=0;
function seedGround(surf, c, r){
  if (!GROUND) return;
  const gsz=GROUND.width;
  const gx=(G_OX+c)/G_SPAN*gsz, gy=(G_OY+r)/G_SPAN*gsz, gw=gsz/G_SPAN;
  const g=surf.ctx;
  g.globalCompositeOperation='source-over';
  g.imageSmoothingQuality='high';
  g.drawImage(GROUND, gx, gy, gw, gw, 0, 0, surf.size||SURF, surf.size||SURF);
  surf.rev=(surf.rev|0)+1;
}

async function getEngine(){
  if (ENG) return ENG;
  const src = window.__INLINE_ENGINE_SRC
    || await (await fetch('/engine.js?t='+Date.now(), {cache:'no-store'})).text();
  ENG = (new Function(src + '\n;return ENGINE;'))();
  return ENG;
}

function blockNeighborhood(b){
  // the block plus one cell of surround, clamped at the sheet edge
  const cw=state.img.width/GRID_COLS, ch=state.img.height/GRID_ROWS;
  const x0=Math.max(0,(b.c-1))*cw, y0=Math.max(0,(b.r-1))*ch;
  const x1=Math.min(GRID_COLS,b.c+b.n+1)*cw, y1=Math.min(GRID_ROWS,b.r+b.n+1)*ch;
  const q=newCanvas(); q.width=q.height=RW;
  const g=q.getContext('2d',{willReadFrequently:true}); g.imageSmoothingQuality='high';
  const winW=(b.n+2)*cw, winH=(b.n+2)*ch;
  const ox=((b.c-1)*cw-x0)/winW*RW, oy=((b.r-1)*ch-y0)/winH*RW;
  g.fillStyle=`rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`; g.fillRect(0,0,RW,RW);
  g.drawImage(state.img, x0,y0,x1-x0,y1-y0, -ox,-oy,(x1-x0)/winW*RW,(y1-y0)/winH*RW);
  const d=g.getImageData(0,0,RW,RW).data;
  const win=new Float64Array(RW*RW); let mean=0;
  for (let i=0,p2=0;i<d.length;i+=4,p2++){ win[p2]=d[i]; mean+=d[i]; }
  mean/=win.length;
  const SIG=Math.round(RW*0.35/(b.n+2));
  const low=blurField(win,SIG);
  const centerLow=new Float64Array(RW*RW);
  for (let y=0;y<RW;y++) for (let x=0;x<RW;x++){
    const wx=Math.min(RW-1,Math.round((1+x/(RW-1)*b.n)*RW/(b.n+2))),
          wy=Math.min(RW-1,Math.round((1+y/(RW-1)*b.n)*RW/(b.n+2)));
    centerLow[y*RW+x]=low[wy*RW+wx];
  }
  return {groundTone:mean, centerLow};
}
function tryMark(m){
  if (!rehearsalEl){ rehearsalEl=newCanvas();
    rehearsal=makeSurface(rehearsalEl,null,RW); }
  return layOn(rehearsal, mine.el, m) ? fieldOf(rehearsalEl, _rehBuf) : null;
}
function tryPair(m1,m2){
  if (!rehearsalEl){ rehearsalEl=newCanvas();
    rehearsal=makeSurface(rehearsalEl,null,RW); }
  if (!layOn(rehearsal, mine.el, m1)) return null;
  if (!layOn(rehearsal, null, m2)) return null;
  return fieldOf(rehearsalEl, _pairBuf);
}
function execMark(m, tools){
  const t = tools[m.tool];
  if (!t) return false;
  const pts = m.path || [];
  if (!pts.length) return false;
  const eff = Object.assign({}, t, m.size ? {sizeMm: m.size*MM_PER_IN} : {});
  beginPass(mine, eff, m.tone, m.lift);
  const pr = q => q.length>2 && q[2]!=null ? q[2] : 1;
  const SZ=mine.size||SURF;                   // the surface decides the scale
  mine.drawing.lastX=pts[0][0]*SZ; mine.drawing.lastY=pts[0][1]*SZ; mine.drawing.lastP=pr(pts[0]);
  dab(mine, eff, pts[0][0]*SZ, pts[0][1]*SZ, pr(pts[0]));
  for (let i=1;i<pts.length;i++) segment(mine, eff, mine.drawing, pts[i][0]*SZ, pts[i][1]*SZ, pr(pts[i]));
  rebuildPass(mine);
  mine.drawing = null;
  return true;
}
const crossesBorder = m => (m.path||[]).some(q=>q[0]<0.06||q[0]>0.94||q[1]<0.06||q[1]>0.94);
function bleedStrokes(slots){
  const layShift=(surf,m,dx,dy)=>{
    const t=state.tools.find(x=>x.name===m.tool); if(!t) return;
    const pts=(m.path||[]); if(!pts.length) return;
    const rad=(t.sizeMm/25.4)/2*1.2;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const q of pts){
      const X=q[0]+dx, Y=q[1]+dy;
      if(X<x0)x0=X; if(X>x1)x1=X; if(Y<y0)y0=Y; if(Y>y1)y1=Y;
    }
    if (x1+rad<0 || x0-rad>1 || y1+rad<0 || y0-rad>1) return;   // cannot touch
    layOn(surf,surf.el,Object.assign({},m,{path:pts.map(q=>[q[0]+dx,q[1]+dy,q[2]])}));
  };
  for (const s2 of slots){
    
    
    const fresh=s2.full.slice(s2.sent).filter(m=>m.stage!=='ground' && !m.field && crossesBorder(m));
    s2.sent=s2.full.length;
    if(!fresh.length) continue;
    for (const nb of slots){
      if (nb===s2) continue;
      const dx=s2.i-nb.i, dy=s2.j-nb.j;
      if (Math.abs(dx)>1||Math.abs(dy)>1) continue;
      for (const m of fresh) layShift(nb.surf,m,dx,dy);
    }
  }
}
function diffuseSeams(slots, midStep){
  const SURF_ = slots[0].surf.size || SURF;    // seams merge at the paper's own scale
  
  
  const W=Math.max(6, Math.round(SURF_*0.12)), EDGE=3;
  const px={};
  for (const s2 of slots) px[s2.i+','+s2.j]={s:s2, d:s2.surf.ctx.getImageData(0,0,SURF_,SURF_),
                                             raise:new Float32Array(SURF_*SURF_)};
  const val=(o,x,y)=>o.d.data[(y*SURF_+x)*4];
  const add=(o,x,y,dv)=>{ const i2=y*SURF_+x;
    if (Math.abs(dv)>Math.abs(o.raise[i2])) o.raise[i2]=dv; };
  const ease=t=>t*t*(3-2*t);
  const smoothAlong=(arr)=>{
    const R=Math.max(2,Math.round(SURF_*0.05)), out=new Float64Array(arr.length);
    let sum=0;
    for(let i2=0;i2<arr.length;i2++){
      sum+=arr[i2];
      if(i2>=2*R+1) sum-=arr[i2-2*R-1];
      const n2=Math.min(i2+1,2*R+1);
      out[Math.max(0,i2-R)]=sum/n2;
    }
    for(let i2=arr.length-R;i2<arr.length;i2++) out[i2]=out[Math.max(0,arr.length-R-1)];
    return out;
  };
  for (const key in px){
    const [i2,j2]=key.split(',').map(Number);
    const A=px[key], R=px[(i2+1)+','+j2], D=px[i2+','+(j2+1)];
    if (R){
      const step=new Float64Array(SURF_);
      for(let y=0;y<SURF_;y++){
        let a=0,b=0;
        for(let k=0;k<EDGE;k++){ a+=val(A,SURF_-1-k,y); b+=val(R,k,y); }
        step[y]=(b-a)/EDGE;
      }
      const sm=smoothAlong(step);
      for(let y=0;y<SURF_;y++){
        
        const d=sm[y];
        for(let k=0;k<W;k++){
          const t=ease((W-k)/W);
          add(A,SURF_-1-k,y,  d*0.5*t);
          add(R,k,y,         -d*0.5*t);
        }
      }
    }
    if (D){
      const step=new Float64Array(SURF_);
      for(let x=0;x<SURF_;x++){
        let a=0,b=0;
        for(let k=0;k<EDGE;k++){ a+=val(A,x,SURF_-1-k); b+=val(D,x,k); }
        step[x]=(b-a)/EDGE;
      }
      const sm=smoothAlong(step);
      for(let x=0;x<SURF_;x++){
        const d=sm[x];
        for(let k=0;k<W;k++){
          const t=ease((W-k)/W);
          add(A,x,SURF_-1-k,  d*0.5*t);
          add(D,x,k,         -d*0.5*t);
        }
      }
    }
  }
  for (const key in px){
    const o=px[key];
    for (let i2=0;i2<o.raise.length;i2++){
      const dv=o.raise[i2]; if (!dv) continue;
      const j4=i2*4, c=Math.max(0,Math.min(255, o.d.data[j4]+dv));
      o.d.data[j4]=o.d.data[j4+1]=o.d.data[j4+2]=c;
    }
    o.s.surf.ctx.putImageData(o.d,0,0);
  }
}
function cellRefField(c,r){
  const cw=state.img.width/GRID_COLS, ch=state.img.height/GRID_ROWS;
  const q=newCanvas(); q.width=q.height=RW;
  const g=q.getContext('2d',{willReadFrequently:true}); g.imageSmoothingQuality='high';
  g.drawImage(state.img, c*cw, r*ch, cw, ch, 0,0,RW,RW);
  return fieldOf(q).slice();
}

const uiYield = () => new Promise(z=>{
  const ch=new MessageChannel(); ch.port1.onmessage=()=>z(); ch.port2.postMessage(0);
});
function compositeBlock(slots, n){
  const SZ=slots[0].surf.size||SURF;
  const c=newCanvas(); c.width=c.height=SZ;
  const g=c.getContext('2d'); g.imageSmoothingQuality='high';
  for (const s2 of slots){
    const x0=Math.round(s2.i*SZ/n), x1=Math.round((s2.i+1)*SZ/n);
    const y0=Math.round(s2.j*SZ/n), y1=Math.round((s2.j+1)*SZ/n);
    g.drawImage(s2.surf.el, 0,0,SZ,SZ, x0,y0,x1-x0,y1-y0);
  }
  return c;
}

function engineProvider(E, tools, blockGround){
  return (s2, phase) => {
    if (s2.pending){
      if ((s2.pending.ph??0) > phase) return 'wait';
      const m=s2.pending; s2.pending=null; return m;
    }
    if (s2.done) return null;
    const cx={
      RW, ref:s2.ref, paper:fieldOf(s2.surf.el), PAPER_TONE,
      groundTone: blockGround, neighborhoodLow: s2.nb.centerLow,
      blurRef: s2.nb.midLow,
      cell:[s2.c,s2.r], markIndex:s2.mark, history:s2.log.slice(),
      tools, blur:(sig,f)=>blurField(f||s2.ref,sig),
      tryMark, tryPair,
      gpuScore: (typeof self!=='undefined' && self.gpuScore) ? self.gpuScore : undefined
    };
    const r0=E.next(cx);
    const fin=m=>{
      if (!m){ s2.done=true; return null; }
      if ((m.ph??0) > phase){ s2.pending=m; return 'wait'; }
      return m;
    };
    return (r0 && typeof r0.then==='function') ? r0.then(fin) : fin(r0);
  };
}
function recordedProvider(logs){
  const qs=logs.map(l=>l.slice());
  return (s2, phase) => {
    const qq=qs[s2.slotIdx];
    if (!qq || !qq.length){ s2.done=true; return null; }
    if ((qq[0].ph??0) > phase) return 'wait';
    return qq.shift();
  };
}

async function runBlock(b, provider, opts){
  const bg=!!(opts&&opts.bg);
  const tools = Object.fromEntries(state.tools.filter(t=>!t.noEngine).map(t=>[t.name,t]));
  if (!provider){
    const E = await getEngine();
    provider = engineProvider(E, tools, blockNeighborhood(b).groundTone);
  }
  
  const PSZ=(opts&&opts.paperSize)||SURF;
  const slots=[]; let idx=0;
  for (let j=0;j<b.n;j++) for (let i=0;i<b.n;i++){
    const c=b.c+i, r=b.r+j;
    const surf=makeSurface(newCanvas(),null,PSZ);
    clearSurface(surf);
    seedGround(surf, c, r);          // the square begins on the whole-drawing midtone
    slots.push({ i, j, c, r, surf, slotIdx:idx++, log:[], full:[], sent:0,
                 pending:null, mark:0, done:false,
                 ref: cellRefField(c,r), nb: cellNeighborhood(c,r) });
  }
  const stepsOut=[]; let total=0;
  for (let phase=0; phase<24; phase++){
    let phaseLaid=0;
    for (const s2 of slots){
      if (s2.done && !s2.pending) continue;
      mine = s2.surf;                                    // tryMark reads this
      for (let guard=0; guard<300; guard++){
        if (RUN_HOOKS.abort(bg)) throw 'bgabort';
        await RUN_HOOKS.pause(bg);
        let m;
        try{ m = provider(s2, phase); if (m && typeof m.then==='function') m = await m; }
        catch(err){ RUN_HOOKS.err(bg, err); s2.done=true; break; }
        if (m==null) break;
        if (m==='wait') break;
        if (!execMark(m, tools)) { s2.done=true; break; }
        const {path, ...rest}=m; s2.log.push(rest); s2.full.push(m); s2.mark++; total++; phaseLaid++;
        
        if (bg || total%8===0) await uiYield();
      }
    }
    if (phaseLaid>0 && b.n>1){
      bleedStrokes(slots);        // border strokes become one continuous deposit
      diffuseSeams(slots, phase===0);  // then the levels merge (directional on the midtone only)
      for (const s2 of slots) s2.pending=null;   // the paper moved: re-ask
      await uiYield();
    }
    if (phaseLaid>0) stepsOut.push(compositeBlock(slots,b.n));
    if (slots.every(s2=>s2.done && !s2.pending)) break;
  }
  return { steps:stepsOut, fin: compositeBlock(slots,b.n),
           logs: slots.map(s2=>s2.full), total };
}

<script>

'use strict';
const $ = id => document.getElementById(id);

let lastAct=0;                              // when the user's hands last moved

const CEILINGS = { 'Fingertip': 78 };          // same rule as the studio
async function loadArsenal(){
  
  if (window.__INLINE_ARSENAL){
    state.tools = window.__INLINE_ARSENAL.map(t => Object.assign({}, t, {

let photo = null;                               // grayscale canvas, full photo

// ---- gallery: every photo ever opened, persisted on this device ----
let _gdb = null;
function gdb(){ return _gdb ||= new Promise((res,rej)=>{
  const q = indexedDB.open('drawgallery',1);
  q.onupgradeneeded = () => q.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function galAll(){ try{ const d=await gdb(); return await new Promise(res=>{
  const t=d.transaction('photos').objectStore('photos').getAll();
  t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]); }); }catch(e){ return []; } }
async function galAdd(rec){ try{ const d=await gdb(); return await new Promise(res=>{

  t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }); }catch(e){ return null; } }

let galActive = null;    // gallery id of the photo now open
let galLoading = null;   // 0..1 creep while the photo itself decodes

function blobImage(blob){ return new Promise((res,rej)=>{
  const u = URL.createObjectURL(blob);
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = e => { URL.revokeObjectURL(u); rej(e); };
  i.src = u; }); }

async function thumbOf(blob){
  const i = await blobImage(blob);
  const T = 192, c = document.createElement('canvas'); c.width = T; c.height = T;
  const g = c.getContext('2d');
  const s = Math.min(i.width, i.height);
  g.filter = 'grayscale(1)';
  g.drawImage(i, (i.width-s)/2, (i.height-s)/2, s, s, 0, 0, T, T);

async function renderGallery(){
  const host = $('gallery'); if (!host) return;
  const recs = (await galAll()).sort((a,b)=>b.ts-a.ts);
  host.innerHTML = '';
  for (const r of recs){
    const d = document.createElement('div'); d.className='gitem'; d.dataset.gid = r.id;

setInterval(()=>{
  const host = $('gallery'); if (!host || !host.children.length) return;
  if (galLoading != null) galLoading = Math.min(0.9, galLoading + 0.08);
  for (const el of host.children){

$('file').addEventListener('change', async e => {

function ratioOf(){
  const a = $('aspect').value;
  if (a === 'photo') return photo.width / photo.height;
  const [w,h] = a.split(':').map(Number);
  return w/h;
}
function dims(){
  const cols = +$('widthIn').value;
  const rows = Math.max(2, Math.round(cols / ratioOf()));
  return {cols, rows};
}
function initFormat(){
  const sel = $('widthIn');
  if (!sel.options.length){
    for (let w=8; w<=40; w+=2){

}
function cropRect(){
  // centred crop of the photo to the chosen ratio
  const r = ratioOf();
  let w = photo.width, h = Math.round(w / r);
  if (h > photo.height){ h = photo.height; w = Math.round(h * r); }
  return { x:(photo.width-w)/2, y:(photo.height-h)/2, w, h };
}
function fmtPreview(){
  const {cols, rows} = dims();
  const cr = cropRect();
  const cv = $('fmtCanvas');
  const scale = Math.min(320/cr.w, 420/cr.h);
  cv.width = Math.round(cr.w*scale); cv.height = Math.round(cr.h*scale);
  const g = cv.getContext('2d');
  g.imageSmoothingQuality='high';
  g.drawImage(photo, cr.x, cr.y, cr.w, cr.h, 0, 0, cv.width, cv.height);
  g.strokeStyle='rgba(255,255,255,0.7)'; g.lineWidth=1;

  for (let r=1;r<rows;r++){ const y=Math.round(r*cv.height/rows)+0.5;
    g.beginPath(); g.moveTo(0,y); g.lineTo(cv.width,y); g.stroke(); }
  $('fmtInfo').textContent = `${cols} x ${rows} in - ${cols*rows} squares`;
}
$('aspect').onchange = ()=>{ fmtPreview(); speculate(); };
$('widthIn').onchange = ()=>{ fmtPreview(); speculate(); };
$('fmtBack').onclick = () => show('scrUpload');

  const {cols, rows} = dims();

const CELL = 96;                                // css px per square at zoom 1

// true-size calibration: CSS says 96px = 1in but few screens agree.

try{ const v=+localStorage.getItem('inchCal'); if (v>=0.6 && v<=2.2) INCAL=v; }catch(e){}
{

const selSet = new Set();                        // 'c,r' strings

function worldSize(){ return { w: GRID_COLS*CELL, h: GRID_ROWS*CELL }; }
function clampView(){
  // the reference stays locked to the viewport: no zooming out past fit,
  // no panning a margin into view
  const {w,h} = worldSize();
  const r = $('viewport').getBoundingClientRect();
  if (!w || !h || !r.width || !r.height) return;
  const fit = Math.min(r.width/w, r.height/h);
  // max zoom is life size: one square = one real inch (INCAL calibrates
  // the browser's 96px "inch" to the actual glass; fit wins on tiny grids)
  view.s = Math.max(fit, Math.min(Math.max(fit, INCAL), view.s));
  const W = w*view.s, H = h*view.s;
  view.x = W <= r.width  ? (r.width  - W)/2 : Math.max(r.width  - W, Math.min(0, view.x));
  view.y = H <= r.height ? (r.height - H)/2 : Math.max(r.height - H, Math.min(0, view.y));
}
function zBounds(){
  // the same limits clampView enforces, for use BEFORE computing a
  // zoom-about-a-point translation (translating at an unclamped scale
  // and clamping after flings the view to an edge)
  const {w,h} = worldSize();
  const r = $('viewport').getBoundingClientRect();
  const fit = (w && r.width) ? Math.min(r.width/w, r.height/h) : 0.05;
  return { min: fit, max: Math.max(fit, INCAL) };
}
function applyView(){

$('stat').addEventListener('click', async ()=>{

    alert(`This device:
GPU ${gms.toFixed(1)}ms vs CPU ~${(jms/1000).toFixed(1)}s per 256 auditions
= ${(jms/gms).toFixed(0)}x faster

(The app does not use the GPU yet - this measures what it will gain.)`);

function blockRC(){

  const c1=Math.max(...cs.map(x=>x.c)), r1=Math.max(...cs.map(x=>x.r));

    if (!selSet.has((c-1)+','+r)) segs.push([x+i, y, x+i, y+CELL]);

const ptrs = new Map();
let tapStart = null, pinch0 = null;
const vp = $('viewport');
vp.addEventListener('pointermove', touchAct);
vp.addEventListener('pointerdown', e => { touchAct();
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===1) tapStart = {x:e.clientX, y:e.clientY, t:Date.now(), moved:false};
  if (ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch0 = { d:Math.hypot(a.x-b.x,a.y-b.y), s:view.s,
               cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, vx:view.x, vy:view.y };
  }
});
vp.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if (ptrs.size===1){
    if (Math.hypot(dx,dy)>6 && tapStart) tapStart.moved=true;
    view.x+=dx; view.y+=dy; applyView();
  }
  p.x=e.clientX; p.y=e.clientY;
  if (ptrs.size===2 && pinch0){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const zb=zBounds();
    const s=clamp(pinch0.s*d/pinch0.d, zb.min, zb.max);
    // zoom about the pinch centre
    const k=s/pinch0.s;
    view.s=s;
    view.x=pinch0.cx-(pinch0.cx-pinch0.vx)*k;
    view.y=pinch0.cy-(pinch0.cy-pinch0.vy)*k;

function endPtr(e){
  ptrs.delete(e.pointerId);

  if (ptrs.size===0 && tapStart && !tapStart.moved && Date.now()-tapStart.t<400){
    const rect=vp.getBoundingClientRect();
    const wx=(tapStart.x-rect.left-view.x)/view.s, wy=(tapStart.y-rect.top-view.y)/view.s;
    const c=Math.floor(wx/CELL), r=Math.floor(wy/CELL);
    if (c>=0&&r>=0&&c<GRID_COLS&&r<GRID_ROWS){
      const n=+$('blockN').value;
      const kk=c+','+r;
      if (n===1 && selSet.has(kk)) selSet.delete(kk);        // tap again to unselect
      else for (let j=0;j<n;j++) for (let i=0;i<n;i++){
        const cc=Math.min(c+i,GRID_COLS-1), rr=Math.min(r+j,GRID_ROWS-1);
        selSet.add(cc+','+rr);
      }
      sel = selSet.size ? selCells()[0] : null;
      steps=[]; stepShown=0;
      drawSel(); stat(selSet.size ? `${selSet.size} square${selSet.size>1?'s':''}` : 'tap a square');

vp.addEventListener('wheel', e => {

  const k = e.deltaY<0 ? 1.15 : 1/1.15;
  const zb=zBounds();

  const kk=s/view.s;

  view.y=e.clientY-rect.top-(e.clientY-rect.top-view.y)*kk;

const hashStr=s2=>{ let h=5381; for(let i=0;i<s2.length;i++) h=(h*33+s2.charCodeAt(i))|0;
  return (h>>>0).toString(36); };
let CKEY=null;                       // photo+format+arsenal+engine fingerprint
const KNOWN=new Set();               // keys already planned, so the queue skips them
async function computeCKEY(){
  const q=document.createElement('canvas'); q.width=q.height=32;
  const g=q.getContext('2d',{willReadFrequently:true});
  g.drawImage(state.img,0,0,32,32);
  const d=g.getImageData(0,0,32,32).data;
  let ph=''; for(let i=0;i<d.length;i+=64) ph+=String.fromCharCode(d[i]);
  CKEY = hashStr(ph)+state.img.width+'x'+state.img.height
       + '|'+GRID_COLS+'x'+GRID_ROWS
       + '|a'+hashStr(JSON.stringify(state.tools))
       
       + '|e'+hashStr(window.__WORKER_SRC||'dev') + '|n7';
  KNOWN.clear(); SETTLED.clear();
  for (const k of await dbKeys()){
    const ks=String(k);
    if (!ks.startsWith(CKEY)) continue;
    KNOWN.add(k);
    const mm=ks.match(/\|set\|(\d+),(\d+)$/);
    if (mm) SETTLED.add((+mm[1])+','+(+mm[2]));
  }

const blobToCanvas=async bl=>{

const HOT=new Map();

function haloCells(){
  
  const inner=new Set(selSet);
  const all=new Map();
  for (const k of inner){ const [c,r]=k.split(',').map(Number);
    all.set(k, {c, r, inner:true}); }
  for (const k of inner){ const [c,r]=k.split(',').map(Number);
    for (let dj=-1;dj<=1;dj++) for (let di=-1;di<=1;di++){
      const cc=c+di, rr=r+dj;
      if (cc<0||rr<0||cc>=GRID_COLS||rr>=GRID_ROWS) continue;
      const kk=cc+','+rr;
      if (!all.has(kk)) all.set(kk, {c:cc, r:rr, inner:false});
    } }
  return [...all.values()];
}

function hotPut(key, val){
  HOT.set(key, val);
  if (HOT.size>12){ const k0=HOT.keys().next().value; HOT.delete(k0); }
}

let PREFETCHING=null;
function prefetchSel(){
  if (!selSet.size || !CKEY) return;
  const key=shownKey();
  if (HOT.has(key) || PREFETCHING===key) return;
  const cs=selCells();
  if (!cs.every(cl=>SETTLED.has(cl.c+','+cl.r))) return;
  PREFETCHING=key;
  stitchSettled(cs).then(out=>{ hotPut(key, out); })
    .finally(()=>{ if (PREFETCHING===key) PREFETCHING=null; });
}

async function stitchSettled(cs){
  const bb=blockRC();

  const imgs=await Promise.all(packs.map(p2=>Promise.all(
    ((p2&&p2.phases)||[]).map(bl=>bl?blobToCanvas(bl):null))));
  const PC=Math.max(64, Math.min(512, Math.floor(2048/Math.max(bb.w,bb.h))));
  
  const paper=()=>{ const cv=document.createElement('canvas'); cv.width=cv.height=PC;
    const g=cv.getContext('2d');
    g.fillStyle=`rgb(${PAPER_TONE},${PAPER_TONE},${PAPER_TONE})`;
    g.fillRect(0,0,PC,PC); return cv; };
  const cur=cs.map(()=>paper());
  const stepsOut=[];
  const compose=()=>{
    const cv=document.createElement('canvas'); cv.width=bb.w*PC; cv.height=bb.h*PC;
    const g=cv.getContext('2d'); g.imageSmoothingQuality='high';
    cs.forEach((cl,i2)=>{ g.drawImage(cur[i2], (cl.c-bb.c)*PC, (cl.r-bb.r)*PC, PC, PC); });
    return cv;
  };
  
  stepsOut.push(compose());                    // step 1: blank paper
  const NPH=Math.max(1, ...imgs.map(im=>im?im.length-1:0), 3);
  for (let gi=1; gi<=NPH; gi++){
    cs.forEach((cl,i2)=>{ if (imgs[i2] && imgs[i2][gi]) cur[i2]=imgs[i2][gi]; });
    stepsOut.push(compose());
  }
  return { steps:stepsOut, fin:stepsOut[stepsOut.length-1], total:0 };
}

let POOL=null;
function poolBoot(){
  
  if (POOL || !window.__WORKER_SRC || typeof OffscreenCanvas==='undefined' || !window.Worker) return;
  
  const NP=new URLSearchParams(location.search).get('w') || localStorage.getItem('drawWorkers');
  const N=NP ? Math.max(1,Math.min(16,+NP))
             : Math.max(1, Math.min(12, (navigator.hardwareConcurrency||4)-4));
  POOL={ws:[], idle:[], waiting:[], jobs:new Map(), seq:0};
  const url=URL.createObjectURL(new Blob([window.__WORKER_SRC],{type:'text/javascript'}));
  for (let k=0;k<N;k++){
    const w=new Worker(url);
    POOL.ws.push(w);
    w.onmessage=ev=>{
      const d=ev.data;
      if (d.type==='ready'){ POOL.idle.push(w); poolKick(); pumpQueue(); return; }
      if (d.type==='gscore'){ pageGpuServe(w, d); return; }
      if (d.type==='engerr'){ console.warn('worker engine error:', d.err); return; }
      const job=POOL.jobs.get(d.id); POOL.jobs.delete(d.id);
      POOL.idle.push(w);
      if (job) (d.type==='done') ? job.res(d.plan) : job.rej(new Error(d.err));
      poolKick(); pumpQueue();       // a finished worker asks for more
    };
    w.onerror=e=>console.warn('worker error', e.message);
  }
  
  pageGpuInit();
}
let PAGE_GPU=false, GPU_SQ=null, GPU_CHAIN=Promise.resolve();
async function pageGpuInit(){
  try{ PAGE_GPU=await GPUK.gpuInit(); }catch(e){ PAGE_GPU=false; }
}
function pageGpuServe(w, d){
  GPU_CHAIN=GPU_CHAIN.then(async ()=>{
    try{
      if (!PAGE_GPU){ w.postMessage({type:'gscoreR', id:d.id, ok:false}); return; }
      if (GPU_SQ!==d.sqkey){
        GPUK.gpuLoadSquare({paper:d.paper, tgt:d.tgt, tgx:d.tgx, tgy:d.tgy});
        GPU_SQ=d.sqkey;
      } else {
        GPUK.gpuUpdatePaper(d.paper);
      }
      const out=await GPUK.gpuScoreBatch(d.list, d.tthr);
      if (!out){ w.postMessage({type:'gscoreR', id:d.id, ok:false}); return; }
      w.postMessage({type:'gscoreR', id:d.id, ok:true, N:out.N,
                     terms:out.terms, hist:out.hist});
    }catch(e){ try{ w.postMessage({type:'gscoreR', id:d.id, ok:false}); }catch(_){} }
  });
}
function poolInit(){
  poolBoot();
  if (!POOL) return;
  POOL.idle.length=0; POOL.waiting.length=0; POOL.jobs.clear();
  for (const w of POOL.ws){
    createImageBitmap(state.img).then(bmp=>{
      w.postMessage({type:'init', tools:state.tools, cols:GRID_COLS, rows:GRID_ROWS, ref:bmp}, [bmp]);
    });
  }
}
function poolJob(key, msg){
  const dup=[...POOL.jobs.values()].find(j=>j.key===key) ||
            POOL.waiting.find(j=>j.key===key);
  if (dup) return dup.promise;
  let res,rej; const promise=new Promise((r1,r2)=>{res=r1;rej=r2;});
  POOL.waiting.push({key, msg, res, rej, promise});
  poolKick();
  return promise;
}
const poolPlan=b=>poolJob(planKey(b), {type:'plan', b});
function poolKick(){
  while (POOL && POOL.idle.length && POOL.waiting.length){
    const w=POOL.idle.pop(), job=POOL.waiting.shift();
    const id=++POOL.seq;
    POOL.jobs.set(id, job);
    w.postMessage(Object.assign({id}, job.msg));
  }
}

function TOTAL_TILES(){ return GRID_COLS*GRID_ROWS; }   // solo plans are the only plans

const FAILED=new Map();          // key -> retry count
const BENCHED=new Set();
function noteFail(kind, key, cr, e){
  const n=(FAILED.get(key)||0)+1; FAILED.set(key,n);
  if (n>=3){
    BENCHED.add(key);
    const msg=`${kind} ${cr} failed: ${String(e&&e.message||e).slice(0,80)}`;
    console.error(msg);
    stat(msg);
  }
}
function nextTarget(){
  if (!CKEY || !state.img) return null;
  const want=[];
  const seen=new Set();
  const add=(c,r)=>{ const k2=c+','+r; if (!seen.has(k2)){ seen.add(k2); want.push({c,r,n:1}); } };
  if (selSet.size) for (const cl of haloCells()) add(cl.c,cl.r);
  for (const q of focusCells(4)) for (const nb of neighbours9(q.c,q.r)) add(nb.c,nb.r);
  const busy=new Set([...(POOL?POOL.jobs.values():[]),...(POOL?POOL.waiting:[])].map(j=>j.key));
  for (const b2 of want){ const k=planKey(b2);
    if (!KNOWN.has(k) && !busy.has(k) && !BENCHED.has(k)) return b2; }
  return null;
}


function neighbours9(c,r){
  const out=[];
  for (let dj=-1;dj<=1;dj++) for (let di=-1;di<=1;di++){
    const cc=c+di, rr=r+dj;
    if (cc>=0&&rr>=0&&cc<GRID_COLS&&rr<GRID_ROWS) out.push({c:cc, r:rr});
  }
  return out;
}

function centerNine(){
  const cx=Math.floor(GRID_COLS/2), cy=Math.floor(GRID_ROWS/2);
  const out=[];
  for (let dj=-1;dj<=1;dj++) for (let di=-1;di<=1;di++)
    out.push({c:Math.min(GRID_COLS-1,Math.max(0,cx+di)),
              r:Math.min(GRID_ROWS-1,Math.max(0,cy+dj))});
  return out;
}
function waveActive(){
  return CKEY && centerNine().some(q=>!SETTLED.has(q.c+','+q.r));
}

let _SEQ=null;
function seqCells(){
  if (_SEQ && _SEQ.cols===GRID_COLS && _SEQ.rows===GRID_ROWS) return _SEQ.list;
  const cx=GRID_COLS/2, cy=GRID_ROWS/2, list=[];
  for (let r=0;r<GRID_ROWS;r++) for (let c=0;c<GRID_COLS;c++) list.push({c,r});
  list.sort((a2,b2)=>
    (ringOf(a2.c,a2.r)-ringOf(b2.c,b2.r)) ||
    (Math.hypot(a2.c+0.5-cx,a2.r+0.5-cy)-Math.hypot(b2.c+0.5-cx,b2.r+0.5-cy)));
  _SEQ={cols:GRID_COLS, rows:GRID_ROWS, list};
  return list;
}
function focusCells(k){
  const out=[];
  for (const q of seqCells()){
    if (SETTLED.has(q.c+','+q.r)) continue;
    out.push(q);
    if (out.length>=k) break;
  }
  return out;
}

function ringOf(c,r){
  const cx=Math.floor(GRID_COLS/2), cy=Math.floor(GRID_ROWS/2);
  return Math.max(Math.abs(c-cx), Math.abs(r-cy));
}
function currentRing(){
  let best=1e9;
  for (let r=0;r<GRID_ROWS;r++) for (let c=0;c<GRID_COLS;c++){
    if (!SETTLED.has(c+','+r)){ const g=ringOf(c,r); if (g<best) best=g; }
  }
  return best===1e9?0:best;
}
const RESERVED=new Set();          // settle targets between pick and enqueue
function nextSettle(){
  if (!CKEY) return null;
  const busy=new Set([...(POOL?POOL.jobs.values():[]),...(POOL?POOL.waiting:[])].map(j=>j.key));
  for (const k of RESERVED) busy.add(k);
  const order=[];
  if (selSet.size) for (const k of selSet){ const [c,r]=k.split(',').map(Number); order.push({c,r}); }
  order.push(...focusCells(4));
  for (const {c,r} of order){
    const kk=c+','+r;
    if (SETTLED.has(kk) || busy.has(setKey(c,r)) || BENCHED.has(setKey(c,r))) continue;
    const nbs=neighbours9(c,r);
    if (nbs.every(x=>KNOWN.has(planKey({c:x.c,r:x.r,n:1})))) return {c,r,cells:nbs};
  }
  return null;
}

async function dispatchSettle(t2){
  const rkey=setKey(t2.c,t2.r);
  RESERVED.add(rkey);                // reserve SYNCHRONOUSLY - the pump loop
  try{                               // re-picks this cell forever otherwise
  const logs=[];
  for (const cl of t2.cells){
    const plan=await dbGet(planKey({c:cl.c,r:cl.r,n:1}));
    logs.push((plan&&plan.logs&&plan.logs[0])||[]);
  }
  const key=setKey(t2.c,t2.r);
  poolJob(key, {type:'settle', center:{c:t2.c,r:t2.r}, cells:t2.cells, logs})
    .then(pl=>dbPut(key, pl))
    .catch(e=>{ console.warn('settle failed', t2.c+','+t2.r, e); noteFail('settle', key, t2.c+','+t2.r, e); })
    .finally(()=>RESERVED.delete(rkey));
  } catch(e){ RESERVED.delete(rkey); }
}
function pumpQueue(){
  if (!state.img || !CKEY) return;
  if (POOL){
    
    if (performance.now()-lastAct < 1500){
      clearTimeout(pumpQueue._t);
      pumpQueue._t=setTimeout(pumpQueue, 1600);
      return;
    }
    // keep every idle worker fed: settles first (they gate the light),
    // then fresh solo plans
    for (let g=0; g<POOL.ws.length*2+4 && POOL.idle.length>POOL.waiting.length; g++){
      const t2=nextSettle();
      if (t2){ dispatchSettle(t2); continue; }
      const b=nextTarget(); if (!b) break;
      const key=planKey(b);
      poolPlan(b).then(async plan=>{ await dbPut(key, plan);
        
        if (!running) stat(`preparing ${KNOWN.size} / ${TOTAL_TILES()}`);
      }).catch(e=>{ console.warn('bg plan failed', b.c+','+b.r, e); noteFail('plan', key, b.c+','+b.r, e); });
    }
    
    return;
  }
}

function cmpCalibrate(c){
  // flat-field calibration: the paper is the light meter. Estimate the local
  // paper brightness across the sheet (bright percentile per block, floored so
  // solid charcoal can't fake "dim light", then smoothed) and divide it out -
  // uneven lighting cancels and paper reads as white everywhere, so charcoal
  // lands at its true tone relative to paper regardless of the room's light.
  const MAX=1600;
  let w=c.width, h=c.height;
  const k=Math.min(1, MAX/Math.max(w,h));
  if (k<1){ const c2=document.createElement('canvas');
    c2.width=Math.round(w*k); c2.height=Math.round(h*k);
    const g2=c2.getContext('2d'); g2.imageSmoothingQuality='high';
    g2.drawImage(c,0,0,c2.width,c2.height);
    c=c2; w=c.width; h=c.height; }
  const g=c.getContext('2d',{willReadFrequently:true});
  const im=g.getImageData(0,0,w,h), d=im.data;
  const B=32, bw=Math.ceil(w/B), bh=Math.ceil(h/B);
  let blocks=new Float64Array(bw*bh);
  const tmp=[];
  for (let by=0;by<bh;by++) for (let bx=0;bx<bw;bx++){
    tmp.length=0;
    const y1=Math.min(h,(by+1)*B), x1=Math.min(w,(bx+1)*B);
    for (let y=by*B;y<y1;y+=2) for (let x=bx*B;x<x1;x+=2) tmp.push(d[(y*w+x)*4]);
    tmp.sort((a,b)=>a-b);
    blocks[by*bw+bx]=tmp[Math.floor(tmp.length*0.9)]||255;
  }
  // which blocks are actually paper? judge against a local upper envelope
  // (repeated 3x3 max) so a lighting gradient can't misclassify dim paper
  let env=blocks.slice();
  for (let it=0; it<4; it++){
    const src=env.slice();
    for (let by=0;by<bh;by++) for (let bx=0;bx<bw;bx++){
      let m=0;
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
        const x=bx+dx, y=by+dy;
        if (x<0||y<0||x>=bw||y>=bh) continue;
        const v=src[y*bw+x]; if (v>m) m=v;
      }
      env[by*bw+bx]=m;
    }
  }
  const valid=new Uint8Array(bw*bh);
  for (let i2=0;i2<blocks.length;i2++){
    if (blocks[i2] >= env[i2]*0.8) valid[i2]=1;
    else blocks[i2]=env[i2];            // charcoal block: seed with the envelope
  }
  // diffuse the light field from paper blocks across charcoal regions
  for (let it=0; it<8; it++){
    const src=blocks.slice();
    for (let by=0;by<bh;by++) for (let bx=0;bx<bw;bx++){
      const i3=by*bw+bx; if (valid[i3]) continue;
      let s=0,n=0;
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
        const x=bx+dx, y=by+dy;
        if (x<0||y<0||x>=bw||y>=bh) continue;
        s+=src[y*bw+x]; n++;
      }
      blocks[i3]=s/n;
    }
  }
  for (let i2=0;i2<blocks.length;i2++) if (blocks[i2]<30) blocks[i2]=30;

      return;
    }
    if (CMP.mode!=='align' || !CMP.img) return;
    if (pts.size===1){
      CMP.t.x+=dx; CMP.t.y+=dy; cmpRender(); cmpSave();
    } else if (pts.size===2 && g0){
      const [a,b]=[...pts.values()], r=cv.getBoundingClientRect();
      const d=Math.hypot(a.x-b.x,a.y-b.y), ang=Math.atan2(b.y-a.y,b.x-a.x);
      const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      const k=d/g0.d, dr=ang-g0.ang;
      const c=Math.cos(dr)*k, s2=Math.sin(dr)*k;
      CMP.t.s=g0.t.s*k; CMP.t.r=g0.t.r+dr;
      CMP.t.x=mx+(g0.t.x-g0.mx)*c-(g0.t.y-g0.my)*s2;
      CMP.t.y=my+(g0.t.x-g0.mx)*s2+(g0.t.y-g0.my)*c;
      cmpRender(); cmpSave();
    }
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if (pts.size<2) g0=null;
    if (pts.size===0) CMP.cGrab=null;
    if (pts.size===0 && tap && !tap.moved && Date.now()-tap.t<400
        && CMP.mode==='flip' && CMP.img){
      CMP.showing = CMP.showing==='ref' ? 'photo' : 'ref'; cmpRender();
    }
    if (pts.size===0) tap=null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    if (CMP.mode!=='align' || !CMP.img) return;
    e.preventDefault();
    const r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const k=e.deltaY<0?1.06:1/1.06;
    CMP.t.s*=k;
    CMP.t.x=px+(CMP.t.x-px)*k; CMP.t.y=py+(CMP.t.y-py)*k;
    cmpRender(); cmpSave();
  }, {passive:false});
  addEventListener('resize', ()=>{ if ($('scrCompare').classList.contains('on')){ cmpSize(); cmpRender(); } });
}

// the tool panel collapses to a corner button for a clear view of the drawing
{
  const hud = $('hud'), tg = $('hudToggle');
  const set = o => {
    hud.style.display = o ? '' : 'none';
    tg.textContent = o ? '▾' : '✎';   // open: collapse arrow; closed: pencil
    try { localStorage.setItem('hudOpen', o ? '1' : '0'); } catch(e){}
  };
  let open = true;
  try { open = localStorage.getItem('hudOpen') !== '0'; } catch(e){}
  set(open);
  tg.onclick = () => set(hud.style.display === 'none');
}

// app shell: fullscreen toggle + installable offline PWA
{
  const el = document.documentElement;
  const canFs = el.requestFullscreen || el.webkitRequestFullscreen;
  const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches
    || navigator.standalone === true;
  document.querySelectorAll('.fsBtn').forEach(b => {
    if (!canFs || standalone){ b.style.display='none'; return; }
    b.onclick = () => {
      if (document.fullscreenElement || document.webkitFullscreenElement){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    };
  });
  const fsMark = () => document.querySelectorAll('.fsBtn').forEach(b =>
    b.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? '&#x2716;' : '&#x26F6;');
  document.addEventListener('fullscreenchange', fsMark);
  document.addEventListener('webkitfullscreenchange', fsMark);
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
