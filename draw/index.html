<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Draw</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
/* minimal by instruction: purely functional, no stylistic embellishment */
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
html,body{width:100%;height:100%;overflow:hidden;background:#141414;color:#e8e6e1;
  font:14px system-ui,sans-serif;touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
body{position:fixed;inset:0}
.screen{padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button,select,input{font:inherit;padding:8px 12px;border:1px solid #555;
  background:#1e1e1e;color:#e8e6e1;border-radius:8px}
button:disabled{opacity:.4}
button.vOn{border-color:#e8e6e1;background:#3a3a3a}
#viewRow{padding-bottom:0}
.row{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}
.grow{flex:1}
/* screen 2: format preview */
#fmtPrev{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fmtCanvas{max-width:100%;max-height:100%}
/* screen 3: main view */
#viewport{flex:1;min-height:0;position:relative;overflow:hidden;background:#2a2a2a}
/* gallery: every photo ever opened, newest first */
#gallery{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:8px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:8px;align-content:start}
.gitem{border:1px solid #555;background:#1e1e1e;padding:4px;cursor:pointer;
  border-radius:10px;overflow:hidden}
.gitem img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.gbar{height:4px;background:#333;margin-top:4px;visibility:hidden}
.gitem.busy .gbar{visibility:visible}
.gfill{height:100%;width:0;background:#e8e6e1}
#calHold{width:216px;height:216px;flex:none;display:flex;
  align-items:center;justify-content:center}
#calBox{width:96px;height:96px;border:1px dashed #888;flex:none}
#calSlide{flex:1;min-width:80px;padding:0}
#lvRow input[type=range]{flex:1;min-width:56px;padding:0}
.adjL{font-size:11px;opacity:0.75;min-width:56px}
#lastShot{position:absolute;left:calc(10px + env(safe-area-inset-left));
  bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;display:none;
  border:2px solid #fff;border-radius:10px;background:#000}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#refImg,#gridCv{position:absolute;left:0;top:0}
/* compare: the photographed drawing aligned over the reference */
#cmpView{flex:1;min-height:0;position:relative;overflow:hidden;background:#2a2a2a}
#cmpCv{position:absolute;left:0;top:0;touch-action:none}
#camVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  display:none;background:#000}
#camGhost{position:absolute;left:0;top:0;pointer-events:none}
#shutter{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);width:74px;height:74px;border-radius:50%;
  background:#fff;border:4px solid #141414;box-shadow:0 0 0 3px #fff;
  display:none;padding:0;z-index:6}
#shutter:active{background:#ccc}
/* the tool panel floats bottom-left over the canvas and can be dismissed */
#hudWrap{position:absolute;left:calc(8px + env(safe-area-inset-left));
  bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  max-width:calc(100% - 16px)}
#hud{border:1px solid #555;background:#161616;border-radius:12px}
#hudToggle{width:44px;height:44px;padding:0;font-size:18px;line-height:1;border-radius:12px}
#camCorner{position:absolute;right:calc(8px + env(safe-area-inset-right));
  bottom:calc(8px + env(safe-area-inset-bottom));z-index:5}
#detCorner{position:absolute;left:calc(30px + (100% - 60px)/3);
  transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:5}
#gridCorner{position:absolute;left:calc(30px + (100% - 60px)*2/3);
  transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:5}
#detBtn{height:44px;min-width:52px;padding:0 10px;border-radius:12px;font-size:13px}
#detMenu{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  display:none;flex-direction:column;gap:6px;background:#1e1e1e;
  border:1px solid #555;border-radius:14px;padding:6px;z-index:6}
#detMenu button{white-space:nowrap;font-size:13px;border-radius:9px}
#gridBtn{width:44px;height:44px;padding:0;line-height:1;border-radius:12px;
  display:flex;align-items:center;justify-content:center}
#compareBtn{width:44px;height:44px;padding:0;line-height:1;border-radius:12px;
  display:flex;align-items:center;justify-content:center}
/* the hint floats as a pill over the image instead of crowding the buttons */
#cmpHint{position:absolute;top:calc(10px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);z-index:7;pointer-events:none;
  background:rgba(16,16,16,0.78);color:#e8e6e1;padding:6px 14px;
  border-radius:999px;font-size:12px;max-width:88%;text-align:center}
#cmpHint:empty{display:none}
#stat{padding:4px 8px;font-size:12px;min-height:22px}
.fsBtn{min-width:40px}
</style>
</head>

    <feColorMatrix id="toneMatrix" type="matrix"
      values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  1 0 0 0 0"/>

<!-- 1: upload -->
<div class="screen on" id="scrUpload">
  <div class="row">
    <button id="newPhoto">+ New reference</button>
    <span id="upStat" class="grow" style="font-size:12px;opacity:0.7"></span>
    <button class="fsBtn" title="Fullscreen">&#x26F6;</button>

<!-- 2: format -->
<div class="screen" id="scrFormat">
  <div class="row">
    <label>Aspect
      <select id="aspect">
        <option value="photo">photo's own</option>
        <option value="2:3">2:3</option>
        <option value="3:4">3:4</option>
        <option value="4:5">4:5</option>
        <option value="1:1">1:1</option>

      <select id="widthIn"></select>
    </label>
    <span id="fmtInfo"></span>
  </div>
  <div id="fmtPrev"><canvas id="fmtCanvas"></canvas></div>
  <div class="row">
    <span>1" &mdash; match a ruler:</span>
    <div id="calHold"><div id="calBox"></div></div>
    <input type="range" id="calSlide" min="60" max="220" value="100">
  </div>
  <div class="row">
    <button id="fmtBack">Back</button>
    <span class="grow"></span>
    <button id="fmtGo">Continue</button>
  </div>
</div>

<!-- 3: main -->
<div class="screen" id="scrMain">
  <div id="viewport">
    <div id="world">
      <canvas id="refImg"></canvas>
      <!-- grid above the reference, inverse of whatever is beneath -->
      <canvas id="gridCv" style="mix-blend-mode:difference"></canvas>
    </div>
  </div>
  <div id="hudWrap">
    <div id="hud">
      <div id="stat"></div>
      <!-- ways of seeing the reference; Grid rules them all -->
      <div class="row" id="viewRow">
        <button id="vDark" class="vBtn">Darks</button>
        <button id="vLight" class="vBtn">Lights</button>
        <button id="vSpec" class="vBtn">Highlights</button>
        <span class="grow"></span>
        <button class="fsBtn" title="Fullscreen">&#x26F6;</button>
      </div>
    </div>
    <button id="hudToggle" title="Tools">&#x25BE;</button>
  </div>
  <div id="detCorner">
    <div id="detMenu">
      <button data-lv="ultra">Ultra</button>
      <button data-lv="hyper">Hyper</button>
      <button data-lv="fine">Fine</button>
    </div>
    <button id="detBtn" title="Detail">Ultra</button>
  </div>
  <div id="gridCorner"><button id="gridBtn" title="Grid"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button></div>
  <!-- compare lives behind the camera in the opposite corner -->
  <div id="camCorner"><button id="compareBtn" title="Compare"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 19.5V7.5h4.2l1.8-2.2h6l1.8 2.2H21v12z"/><circle cx="12" cy="13.3" r="3.4"/></svg></button></div>
</div>

<!-- 4: compare - photograph the real drawing, align it, flip against the reference -->
<div class="screen" id="scrCompare">
  <div id="cmpView"><canvas id="cmpCv"></canvas>
    <video id="camVid" playsinline autoplay muted></video>
    <canvas id="camGhost"></canvas>
    <span id="cmpHint"></span>
    <canvas id="lastShot" title="Use the last photo"></canvas>
    <button id="shutter" title="Capture"></button></div>
  <div id="lvRow" style="display:none">
    <div class="row">
      <span class="adjL">exposure</span><input type="range" id="aExp" min="-100" max="100" value="0">
      <span class="adjL">contrast</span><input type="range" id="aCon" min="15" max="200" value="100">
    </div>
    <div class="row">
      <span class="adjL">highlights</span><input type="range" id="aHi" min="-100" max="100" value="0">
      <span class="adjL">darks</span><input type="range" id="aSh" min="-100" max="100" value="0">
    </div>
    <div class="row">
      <span class="adjL">blacks</span><input type="range" id="aBl" min="0" max="120" value="0">
      <span class="adjL">whites</span><input type="range" id="aWh" min="150" max="255" value="255">
      <button id="lvReset">Auto</button>
    </div>
  </div>
  <div class="row">
    <input type="file" id="cmpFile" accept="image/*" hidden>
    <button id="cmpShoot">Photo</button>
    <button id="cmpFlip" disabled>Flip view</button>
    <button id="cmpSplit" disabled>Side by side</button>
    <button id="cmpSeam" disabled>Split</button>
    <button id="lvBtn" disabled>Adjust</button>
    <button id="cmpCorn" disabled>Corners</button>
    <span class="grow"></span>
    <button id="cmpBack">Back</button>
  </div>
</div>

<script>
window.__INLINE_ARSENAL = [{"id": 30, "name": "Fingertip", "mode": "deposit", "tone": 15, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 15.6, "fuzz": 50, "spacing": 6, "pSize": false, "liftCeiling": 78}, {"id": 12, "name": "Q-tip", "mode": "deposit", "tone": 15, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 5, "fuzz": 50, "spacing": 6, "pSize": false, "noEngine": true}, {"id": 24, "name": "Very Light Big Brush", "mode": "deposit", "tone": 192, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 23, "name": "Light Big Brush", "mode": "deposit", "tone": 110, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 70, "spacing": 6, "pSize": false}, {"id": 21, "name": "Big Brush", "mode": "deposit", "tone": 66, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 74, "spacing": 6, "pSize": false}, {"id": 29, "name": "Dark Big", "mode": "deposit", "tone": 40, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 29.9, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 14, "name": "Big Blend", "mode": "blend", "tone": 128, "liftAmount": 60, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 30, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 26, "name": "Light Med", "mode": "deposit", "tone": 120, "liftAmount": 20, "blendType": "directional", "spreadMm": 10, "strength": 60, "lighten": 0, "sizeMm": 9.1, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 25, "name": "Med Brush", "mode": "deposit", "tone": 78, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 67, "lighten": 0, "sizeMm": 9.1, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 28, "name": "Dark Med", "mode": "deposit", "tone": 43, "liftAmount": 20, "blendType": "directional", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 7, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 27, "name": "Med Blend", "mode": "blend", "tone": 128, "liftAmount": 20, "blendType": "spread", "spreadMm": 2, "strength": 60, "lighten": 0, "sizeMm": 7, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 16, "name": "Kneaded Eraser", "mode": "lift", "tone": 128, "liftAmount": 20, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 9.1, "fuzz": 50, "spacing": 6, "pSize": false}, {"id": 17, "name": "Tissue", "mode": "lift", "tone": 128, "liftAmount": 15, "lighten": 0, "blendType": "spread", "spreadMm": 2, "strength": 60, "sizeMm": 20.9, "fuzz": 50, "spacing": 6, "pSize": false}];
</script>
<script>
/* GPU.JS - the WebGPU audition engine. SPEED.md phase: full port, gated.

   The spike proved the shape: 256 auditions x 16K px in 3.2ms, bit-matching
   JS (96x). This file carries the real thing: rehearsal (deposit AND lift
   with the stain clamp) plus ALL FOUR cost terms, per candidate, in one
   dispatch. It integrates NOWHERE until gpuSelfTest() passes parity against
   the worker's own arithmetic - the engine's judgment must not move.

   API (all no-ops if WebGPU is absent):
     await gpuInit()                       -> true if a device is live
     gpuLoadSquare({paper,tgt,tgx,tgy,stain,tdark})  Float32Array fields at RW
     await gpuScoreBatch(cands)            -> Float32Array of costs
       cand: {stamps:[[x,y,r,amp]..], mode:0|1, tone, lift}   (RW pixel space)
     await gpuSelfTest()                   -> {ok, worst}  vs the JS mirror

   Integration plan (next): engine gains ctx.tryMarkBatch; the decision loop
   collects candidates, scores them here, rehearses ONLY the winner on CPU
   for the paper update. Fallback: the existing per-candidate worker path.

   NOT DONE YET (in order):
   - histogram percentile terms (shortfall/blown) - kernel scaffold below
     computes the two histograms with atomics; the percentile walk + combine
     still happens on CPU from the binned readback (cheap: 2x256 u32 per cand).
   - blends stay CPU (canvas-shaped physics).
   - parity harness wiring into the worker (compare vs cost() on live squares).
*/

<script>

'use strict';
let GRID_COLS = 20, GRID_ROWS = 30;          // set by the format screen
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const state = { img:null, tools:[], refKey:'user' };
</script>

<script>

'use strict';
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); };
let lastAct=0;                              // when the user's hands last moved
const touchAct=()=>{ lastAct=performance.now(); };


const CEILINGS = { 'Fingertip': 78 };          // same rule as the studio
async function loadArsenal(){
  
  if (window.__INLINE_ARSENAL){
    state.tools = window.__INLINE_ARSENAL.map(t => Object.assign({}, t, {
      tone: t.tone ?? 128, liftAmount: t.liftAmount ?? 20,
      liftCeiling: t.liftCeiling ?? CEILINGS[t.name] ?? null
    }));
    return 'inline';
  }
  for (const u of ['/stream/arsenal.json','/arsenal.json']){
    try {
      const r = await fetch(u,{cache:'no-store'}); if (!r.ok) continue;
      const d = await r.json();
      if (!d || !Array.isArray(d.tools) || !d.tools.length) continue;
      state.tools = d.tools.map(t => Object.assign({}, t, {
        tone: t.tone ?? 128, liftAmount: t.liftAmount ?? 20,
        liftCeiling: t.liftCeiling ?? CEILINGS[t.name] ?? null
      }));
      return u;
    } catch(e){}
  }
  return null;
}


let photo = null;                               // grayscale canvas, full photo

// ---- gallery: every photo ever opened, persisted on this device ----
let _gdb = null;
function gdb(){ return _gdb ||= new Promise((res,rej)=>{
  const q = indexedDB.open('drawgallery',1);
  q.onupgradeneeded = () => q.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function galAll(){ try{ const d=await gdb(); return await new Promise(res=>{
  const t=d.transaction('photos').objectStore('photos').getAll();
  t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]); }); }catch(e){ return []; } }
async function galAdd(rec){ try{ const d=await gdb(); return await new Promise(res=>{
  const t=d.transaction('photos','readwrite').objectStore('photos').add(rec);
  t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }); }catch(e){ return null; } }

let galActive = null;    // gallery id of the photo now open
let galLoading = null;   // 0..1 creep while the photo itself decodes

function blobImage(blob){ return new Promise((res,rej)=>{
  const u = URL.createObjectURL(blob);
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = e => { URL.revokeObjectURL(u); rej(e); };
  i.src = u; }); }

async function thumbOf(blob){
  const i = await blobImage(blob);
  const T = 192, c = document.createElement('canvas'); c.width = T; c.height = T;
  const g = c.getContext('2d');
  const s = Math.min(i.width, i.height);
  g.filter = 'grayscale(1)';
  g.drawImage(i, (i.width-s)/2, (i.height-s)/2, s, s, 0, 0, T, T);
  URL.revokeObjectURL(i.src);
  return c.toDataURL('image/jpeg', 0.72);
}

async function renderGallery(){
  const host = $('gallery'); if (!host) return;
  const recs = (await galAll()).sort((a,b)=>b.ts-a.ts);
  host.innerHTML = '';
  for (const r of recs){
    const d = document.createElement('div'); d.className='gitem'; d.dataset.gid = r.id;
    const im = document.createElement('img'); im.src = r.thumb; im.alt = r.name||'';
    const bar = document.createElement('div'); bar.className='gbar';
    bar.appendChild(Object.assign(document.createElement('div'),{className:'gfill'}));
    d.appendChild(im); d.appendChild(bar);
    d.onclick = () => {
      if (PREP.active) return;                // still cooking: not yet usable
      if (galActive === r.id && photo){       // already open: jump back in
        show(GRID_READY ? 'scrMain' : 'scrFormat'); return;
      }
      if (r.blob) openPhoto(r.blob, r.id);
    };
    host.appendChild(d);
  }
}

let GRID_READY = false;                        // true once initMain has run
setInterval(()=>{
  const host = $('gallery'); if (!host || !host.children.length) return;
  if (galLoading != null) galLoading = Math.min(0.9, galLoading + 0.08);
  for (const el of host.children){
    const on = galActive != null && +el.dataset.gid === galActive;
    let p = null;
    if (on){
      if (galLoading != null) p = galLoading;                 // decoding the photo
      else if (PREP.active && PREP.gid === galActive) p = PREP.p;   // cooking
    }
    el.classList.toggle('busy', !!(on && p != null && p < 1));
    if (p != null) el.querySelector('.gfill').style.width = (100*p).toFixed(1)+'%';
  }
}, 400);

function openPhoto(blob, gid){
  galActive = gid ?? null; galLoading = 0.15;
  $('upStat').textContent = '...';
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d');
    g.filter = 'grayscale(1)';                  // automatic black and white
    g.drawImage(img, 0, 0);
    g.filter = 'none';
    photo = c;
    URL.revokeObjectURL(img.src);
    galLoading = null; GRID_READY = false;
    $('upStat').textContent = '';
    initFormat();
    let fmt = null;   // a photo formatted before goes straight to the drawing
    if (gid != null){ try{ fmt = JSON.parse(localStorage.getItem('fmt|'+gid)); }catch(e){} }
    if (fmt && fmt.w){
      $('aspect').value = fmt.a || 'photo';
      $('widthIn').value = fmt.w;
      fmtPreview();
      enterMain();
    } else {
      show('scrFormat');
      speculate();                     // the dwell on this screen is free compute
    }
  };
  img.onerror = () => { galLoading = null; galActive = null;
    $('upStat').textContent = 'could not read that file'; };
  img.src = URL.createObjectURL(blob);
}

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('upStat').textContent = '...';
  let gid = null;
  try {
    const thumb = await thumbOf(f);
    gid = await galAdd({ ts: Date.now(), name: f.name||'', thumb, blob: f });
    renderGallery();
  } catch(err){}
  openPhoto(f, gid);
});
renderGallery();
$('newPhoto').onclick = () => $('file').click();


function ratioOf(){
  const a = $('aspect').value;
  if (a === 'photo') return photo.width / photo.height;
  const [w,h] = a.split(':').map(Number);
  return w/h;
}
function dims(){
  const cols = +$('widthIn').value;
  const rows = Math.max(2, Math.round(cols / ratioOf()));
  return {cols, rows};
}
function initFormat(){
  const sel = $('widthIn');
  if (!sel.options.length){
    for (let w=8; w<=40; w+=2){
      const o=document.createElement('option'); o.value=w; o.textContent=w;
      if (w===20) o.selected=true;
      sel.appendChild(o);
    }
  }
  fmtPreview();
}
function cropRect(){
  // centred crop of the photo to the chosen ratio
  const r = ratioOf();
  let w = photo.width, h = Math.round(w / r);
  if (h > photo.height){ h = photo.height; w = Math.round(h * r); }
  return { x:(photo.width-w)/2, y:(photo.height-h)/2, w, h };
}
function fmtPreview(){
  const {cols, rows} = dims();

  const g = cv.getContext('2d');
  g.imageSmoothingQuality='high';
  g.drawImage(photo, cr.x, cr.y, cr.w, cr.h, 0, 0, cv.width, cv.height);
  g.strokeStyle='rgba(255,255,255,0.7)'; g.lineWidth=1;
  for (let c=1;c<cols;c++){ const x=Math.round(c*cv.width/cols)+0.5;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,cv.height); g.stroke(); }
  for (let r=1;r<rows;r++){ const y=Math.round(r*cv.height/rows)+0.5;
    g.beginPath(); g.moveTo(0,y); g.lineTo(cv.width,y); g.stroke(); }

}

const CELL = 96;                                // css px per square at zoom 1
let view = { x:0, y:0, s:1 };

// true-size calibration: CSS says 96px = 1in but few screens agree.
// The format screen's dashed box + slider let the artist set the truth once.
let INCAL = 1;
try{ const v=+localStorage.getItem('inchCal'); if (v>=0.6 && v<=2.2) INCAL=v; }catch(e){}

    sl.value=Math.round(INCAL*100); };

function worldSize(){ return { w: GRID_COLS*CELL, h: GRID_ROWS*CELL }; }
function clampView(){
  // the reference stays locked to the viewport: no zooming out past fit,
  // no panning a margin into view
  const {w,h} = worldSize();
  const r = $('viewport').getBoundingClientRect();
  if (!w || !h || !r.width || !r.height) return;
  const fit = Math.min(r.width/w, r.height/h);
  // max zoom is life size: one square = one real inch (INCAL calibrates
  // the browser's 96px "inch" to the actual glass; fit wins on tiny grids)
  view.s = Math.max(fit, Math.min(Math.max(fit, INCAL), view.s));
  const W = w*view.s, H = h*view.s;
  view.x = W <= r.width  ? (r.width  - W)/2 : Math.max(r.width  - W, Math.min(0, view.x));
  view.y = H <= r.height ? (r.height - H)/2 : Math.max(r.height - H, Math.min(0, view.y));
}
function zBounds(){
  // the same limits clampView enforces, for use BEFORE computing a
  // zoom-about-a-point translation (translating at an unclamped scale
  // and clamping after flings the view to an edge)
  const {w,h} = worldSize();
  const r = $('viewport').getBoundingClientRect();
  const fit = (w && r.width) ? Math.min(r.width/w, r.height/h) : 0.05;
  return { min: fit, max: Math.max(fit, INCAL) };
}
function applyView(){
  clampView();
  $('world').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
}
addEventListener('resize', () => { if ($('scrMain').classList.contains('on')) applyView(); });
function paintWorld(){
  // the re-derivable layers: reference, grid, dimming - callable again after
  // the browser evicts canvas memory in the background
  const {w,h} = worldSize();
  const g = $('refImg').getContext('2d');
  g.imageSmoothingQuality='high';
  g.drawImage(viewSrc(), 0, 0, w, h);
  applyGrid();
  const gg = $('gridCv').getContext('2d');
  gg.clearRect(0,0,w,h);
  gg.strokeStyle='rgba(255,255,255,0.75)'; gg.lineWidth=1;   // difference-blended: reads as the inverse of what's beneath
  for (let c=1;c<GRID_COLS;c++){ const x=c*CELL+0.5;
    gg.beginPath(); gg.moveTo(x,0); gg.lineTo(x,h); gg.stroke(); }
  for (let r=1;r<GRID_ROWS;r++){ const y=r*CELL+0.5;
    gg.beginPath(); gg.moveTo(0,y); gg.lineTo(w,y); gg.stroke(); }
}
function initMain(){
  const {w,h} = worldSize();
  for (const id of ['refImg','gridCv']){
    const cv=$(id); cv.width=w; cv.height=h;

  // closed = the full image. Settled before the first paint.

  const vp = $('viewport').getBoundingClientRect();
  view.s = Math.max(0.05, Math.min(vp.width/w, vp.height/h) || 0.05);
  view.x = (vp.width - w*view.s)/2; view.y = (vp.height - h*view.s)/2;
  applyView();

}

const ptrs = new Map();
let pinch0 = null;
const vp = $('viewport');
vp.addEventListener('pointermove', touchAct);
vp.addEventListener('pointerdown', e => { touchAct();
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch0 = { d:Math.hypot(a.x-b.x,a.y-b.y), s:view.s,
               cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, vx:view.x, vy:view.y };
  }
});
vp.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if (ptrs.size===1){ view.x+=dx; view.y+=dy; applyView(); }
  p.x=e.clientX; p.y=e.clientY;
  if (ptrs.size===2 && pinch0){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const zb=zBounds();
    const s=clamp(pinch0.s*d/pinch0.d, zb.min, zb.max);
    // zoom about the pinch centre
    const k=s/pinch0.s;
    view.s=s;
    view.x=pinch0.cx-(pinch0.cx-pinch0.vx)*k;
    view.y=pinch0.cy-(pinch0.cy-pinch0.vy)*k;
    applyView();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinch0=null;
}
vp.addEventListener('pointerup', endPtr);
vp.addEventListener('pointercancel', endPtr);

// double tap: zoomed in -> all the way out; already out -> all the way in
// on the tapped spot
let tapDown=null, tapLast=null;
vp.addEventListener('pointerdown', e => {
  $('world').style.transition='';
  tapDown = ptrs.size===1 ? {t:Date.now(), x:e.clientX, y:e.clientY, id:e.pointerId} : null;
  if (ptrs.size>1) tapLast=null;
});
vp.addEventListener('pointerup', e => {
  const td=tapDown; tapDown=null;
  if (!td || td.id!==e.pointerId) { tapLast=null; return; }
  const now=Date.now();
  if (now-td.t>350 || Math.hypot(e.clientX-td.x, e.clientY-td.y)>12){ tapLast=null; return; }
  if (tapLast && now-tapLast.t<400 && Math.hypot(td.x-tapLast.x, td.y-tapLast.y)<48){
    tapLast=null;
    const rect=vp.getBoundingClientRect(), zb=zBounds();
    if (view.s > zb.min*1.02){
      view.s=zb.min;                     // clampView centres a fitted view
    } else {
      const k=zb.max/view.s;
      view.x=e.clientX-rect.left-(e.clientX-rect.left-view.x)*k;
      view.y=e.clientY-rect.top-(e.clientY-rect.top-view.y)*k;
      view.s=zb.max;
    }
    const w=$('world');
    w.style.transition='transform 0.22s ease';
    applyView();
    setTimeout(()=>{ w.style.transition=''; }, 240);
  } else {
    tapLast={t:now, x:td.x, y:td.y};
  }
});
vp.addEventListener('pointercancel', ()=>{ tapDown=null; tapLast=null; });

vp.addEventListener('wheel', e => {
  e.preventDefault();
  const rect=vp.getBoundingClientRect();
  const k = e.deltaY<0 ? 1.15 : 1/1.15;
  const zb=zBounds();
  const s = clamp(view.s*k, zb.min, zb.max);
  if (s === view.s) return;                      // already at the limit: no drift
  const kk=s/view.s;
  view.x=e.clientX-rect.left-(e.clientX-rect.left-view.x)*kk;
  view.y=e.clientY-rect.top-(e.clientY-rect.top-view.y)*kk;
  view.s=s; applyView();
}, {passive:false});

const hashStr=s2=>{ let h=5381; for(let i=0;i<s2.length;i++) h=(h*33+s2.charCodeAt(i))|0;
  return (h>>>0).toString(36); };
let CKEY=null;                       // photo+format+arsenal+engine fingerprint
async function computeCKEY(){
  const q=document.createElement('canvas'); q.width=q.height=32;
  const g=q.getContext('2d',{willReadFrequently:true});
  g.drawImage(state.img,0,0,32,32);
  const d=g.getImageData(0,0,32,32).data;
  let ph=''; for(let i=0;i<d.length;i+=64) ph+=String.fromCharCode(d[i]);
  CKEY = hashStr(ph)+state.img.width+'x'+state.img.height
       + '|'+GRID_COLS+'x'+GRID_ROWS
       + '|a'+hashStr(JSON.stringify(state.tools))
       + '|emjhcgv|n7';   // frozen v11-engine tag: keys minted before the
                          // engine was retired keep working
}



const blobToCanvas=async bl=>{
  const bm=await createImageBitmap(bl);
  const q=document.createElement('canvas'); q.width=bm.width; q.height=bm.height;
  q.getContext('2d').drawImage(bm,0,0); bm.close(); return q;
};

// ---- the reference as composable layers -------------------------------
// The shading - the pure form - is the constant ground; Darks (texture
// darker than the form), Lights (texture lighter than it, sheen included)
// and Highlights (only the brightest sparkle pops) toggle on top of it in
// any combination. All three on reassembles the photo exactly. Display only.
const LAYERS={dk:true, lt:true, hl:true};
let GRID_ON=true;
try{ GRID_ON = localStorage.getItem('gridOn')!=='0'; }catch(e){}
const FORM={cv:null, specCv:null, key:null, busy:null};
const COMP={key:null, ph:null, sh:null, hl:null, sig:null, cv:null};

function applyGrid(){
  $('gridCv').style.display = GRID_ON ? '' : 'none';
  $('gridBtn').style.opacity = GRID_ON ? '1' : '0.35';
}
function layerButtons(){
  for (const [id,k] of [['vDark','dk'],['vLight','lt'],['vSpec','hl']])
    $(id).classList.toggle('vOn', LAYERS[k]);
}
function grayData(src){
  const {w,h}=worldSize();
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingQuality='high';
  g.drawImage(src,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const out=new Uint8Array(w*h);
  for (let i=0,j=0;i<out.length;i++,j+=4)
    out[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  return out;
}
const grayCanvas=(buf,w,h)=>{
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  const id=g.createImageData(w,h);
  for (let i=0,j=0;i<buf.length;i++,j+=4){
    id.data[j]=id.data[j+1]=id.data[j+2]=buf[i]; id.data[j+3]=255;
  }
  g.putImageData(id,0,0);
  return c;
};
function compParts(){
  if (COMP.key===CKEY && COMP.ph) return;
  COMP.key=CKEY;
  COMP.ph=grayData(state.img);
  COMP.sh=grayData(FORM.cv);
  const N=COMP.ph.length;
  // a highlight is the accent an artist saves for last: the midpoint of
  // two readings - the value lift into the photo's top ~70 levels, and
  // any light texture stronger than 25 levels above the shading. Toggling
  // Highlights off genuinely removes it; Lights keeps the remainder.
  const phist=new Uint32Array(256);
  for (let i=0;i<N;i++) phist[COMP.ph[i]]++;
  let pacc=0, phTop=255;
  for (let v=255;v>=0;v--){ pacc+=phist[v]; if (pacc>=N*0.0005){ phTop=v; break; } }
  const T=phTop-70;
  COMP.hl=new Float32Array(N);
  for (let i=0;i<N;i++){
    const ph=COMP.ph[i], sh=COMP.sh[i];
    const L=ph-sh;
    if (L<=0) continue;
    const hd=Math.max(0, ph-Math.max(sh, T));
    const he=Math.max(0, L-25);
    COMP.hl[i]=Math.min(L, (hd+he)*0.5);
  }
  COMP.dp=new Uint8Array(N);
  for (let i=0;i<N;i++){
    const d=COMP.ph[i]-COMP.hl[i]; COMP.dp[i]=d<0?0:(d>255?255:d);
  }
  COMP.sig=null; COMP.cv=null;
}
function compositeCv(){
  compParts();
  let det=null;
  if (DETAIL!=='ultra'){
    if (DET.key===CKEY && DET.lv[DETAIL]) det=DET.lv[DETAIL];
    else ensureDetail(DETAIL);          // async; the ultra tool stands in
  }
  const eff=det?DETAIL:'ultra';
  const sig=(LAYERS.dk?'D':'')+(LAYERS.lt?'L':'')+(LAYERS.hl?'H':'')+'T'+eff;
  if (COMP.sig===sig && COMP.cv) return COMP.cv;
  const {w,h}=worldSize();
  const N=COMP.ph.length, buf=new Uint8Array(N);
  for (let i=0;i<N;i++){
    const sh=COMP.sh[i];
    const dD=det?det.dD[i]:Math.max(0, sh-COMP.ph[i]);
    const lD=det?det.lD[i]:Math.max(0, COMP.dp[i]-sh);
    const hl=det?det.hl[i]:COMP.hl[i];
    let v=sh;
    if (LAYERS.dk) v-=dD;
    if (LAYERS.lt) v+=lD;
    if (LAYERS.hl) v+=hl;
    buf[i]=v<0?0:(v>255?255:v);
  }
  COMP.sig=sig; COMP.cv=grayCanvas(buf,w,h);
  return COMP.cv;
}

// ---- detail scale: only marks the tool can actually make ----------------
// Three renditions of the textures, drawn onto the shading with three tool
// sizes. Fine is the tiniest tool - every texture exactly. With a bigger
// tool, a mark exists only where the tool physically fits inside it
// (grayscale opening); a detail the tool cannot achieve is left blank.
let DETAIL='ultra';
const DET_STEPS=['ultra','hyper','fine'];
const DET_LABEL={ultra:'Ultra', hyper:'Hyper', fine:'Fine'};
// tools: a single point (1px, everything); the midpoint of the 9px
// square and 13px diamond (averaged marks); the 21px octagon eased back
// a touch toward the diamond (75/25 blend). 96px = 1in.
const DET_SHAPE={hyper:'mid', fine:'nearbroad'};
const DET={key:null, busy:null, lv:{}};
async function ensureDetail(lv){
  if (DET.key!==CKEY){ DET.key=CKEY; DET.lv={}; }
  if (lv==='ultra' || DET.lv[lv] || DET.busy) return;
  DET.busy=lv;
  const {w,h}=worldSize();
  const key=CKEY;
  const a=await dbGet('dtd16'+lv+'|'+key), b=await dbGet('dtl16'+lv+'|'+key),
        c=await dbGet('dth16'+lv+'|'+key);
  if (a && b && c){
    try{
      const ca=await blobToCanvas(a), cb=await blobToCanvas(b), cc=await blobToCanvas(c);
      DET.lv[lv]={dD:grayData(ca), lD:grayData(cb), hl:grayData(cc)};
      DET.busy=null;
      if (key===CKEY && DETAIL===lv && $('scrMain').classList.contains('on')) viewRepaint();
      return;
    }catch(e){}
  }
  compParts();
  const N=COMP.ph.length;
  const dD=new Uint8Array(N), lD=new Uint8Array(N), hl=new Uint8Array(N);
  for (let i=0;i<N;i++){
    const d=COMP.sh[i]-COMP.ph[i];
    if (d>0) dD[i]=d;
    const l=COMP.dp[i]-COMP.sh[i];
    if (l>0) lD[i]=l;
    const v=Math.round(COMP.hl[i]); hl[i]=v>255?255:v;
  }
  const wk=new Worker(URL.createObjectURL(new Blob([DETAIL_SRC],{type:'text/javascript'})));
  wk.onmessage=ev=>{
    if (ev.data.p!==undefined){
      prepProg(ev.data.p);
      if (DETAIL===lv && $('scrMain').classList.contains('on'))
        stat('sifting the detail  '+Math.round(ev.data.p*100)+'%');
      return;
    }
    wk.terminate(); DET.busy=null;
    if (key!==CKEY) return;
    DET.lv[lv]={dD:ev.data.dD, lD:ev.data.lD, hl:ev.data.hl};
    try{
      dbPutRaw('dtd16'+lv+'|'+key, canvasBlob(grayCanvas(ev.data.dD,w,h)));
      dbPutRaw('dtl16'+lv+'|'+key, canvasBlob(grayCanvas(ev.data.lD,w,h)));
      dbPutRaw('dth16'+lv+'|'+key, canvasBlob(grayCanvas(ev.data.hl,w,h)));
    }catch(e){}
    if (DETAIL===lv && $('scrMain').classList.contains('on')){ viewRepaint(); stat(''); }
  };
  wk.onerror=()=>{ wk.terminate(); DET.busy=null; };
  wk.postMessage({dD, lD, hl, W:w, H:h, shape:DET_SHAPE[lv]}, [dD.buffer, lD.buffer, hl.buffer]);
}
function viewSrc(){
  if (!state.img) return state.img;
  if (!(FORM.cv && FORM.key===CKEY)){
    ensureForm();                     // async; the photo stands in meanwhile
    return state.img;
  }
  return compositeCv();
}
function viewRepaint(){ paintWorld(); }
const canvasBlob=(c,type,q)=>{
  // synchronous encode everywhere: a toBlob callback can starve for seconds
  // behind heavy work, return null in some engines, and a navigation before
  // it fires loses the data
  const du=c.toDataURL(type||'image/png',q);

// the breakdown recipe, ported to run beside the page: bright-outlier
// removal at three scales (specular), domain-transform edge-preserving
// flattening (texture), and a touch of fuzz on the hardest edges
const MEDIAN_SRC = `
function medianBlur(src, W, H, k){
  const rr=k>>1, half=((k*k)-1)>>1;
  const out=new Uint8Array(W*H);
  const coarse=new Int32Array(16), fine=new Int32Array(256);
  const cxf=x=>x<0?0:(x>=W?W-1:x), cyf=y=>y<0?0:(y>=H?H-1:y);
  for (let y=0;y<H;y++){
    coarse.fill(0); fine.fill(0);
    for (let dx=-rr;dx<=rr;dx++){
      const c=cxf(dx);
      for (let dy=-rr;dy<=rr;dy++){
        const v=src[cyf(y+dy)*W+c]; fine[v]++; coarse[v>>4]++;
      }
    }
    for (let x=0;x<W;x++){
      if (x>0){
        const ca=cxf(x+rr), cr=cxf(x-1-rr);
        for (let dy=-rr;dy<=rr;dy++){
          const row=cyf(y+dy)*W;
          const va=src[row+ca]; fine[va]++; coarse[va>>4]++;
          const vr=src[row+cr]; fine[vr]--; coarse[vr>>4]--;
        }
      }
      let cnt=0, cb=0;
      while (cnt+coarse[cb]<=half){ cnt+=coarse[cb]; cb++; }
      let v=cb<<4;
      while (cnt+fine[v]<=half){ cnt+=fine[v]; v++; }
      out[y*W+x]=v;
    }
  }
  return out;
}
`;
const FORM_SRC = MEDIAN_SRC + `
function dtFilter(F, W, H, sigmaS, sigmaR){
  // 2.5: cv2 sums the domain-transform derivative over 3 replicated
  // channels; this factor was tuned to reproduce the reference recipe
  const iters=3, ratio=2.5*sigmaS/sigmaR;
  const dh=new Uint8Array(W*H), dv=new Uint8Array(W*H);
  for (let y=0;y<H;y++){
    const o=y*W;
    for (let x=1;x<W;x++){ const d=Math.abs(F[o+x]-F[o+x-1]); dh[o+x]=d>255?255:d; }
  }
  for (let y=1;y<H;y++){
    const o=y*W;
    for (let x=0;x<W;x++){ const d=Math.abs(F[o+x]-F[o-W+x]); dv[o+x]=d>255?255:d; }
  }
  for (let it=0;it<iters;it++){
    const sigmaH=sigmaS*Math.SQRT2*Math.pow(2,iters-it-1)/Math.sqrt(Math.pow(4,iters)-1);
    const lna=-Math.SQRT2/sigmaH;
    const tab=new Float32Array(256);
    for (let t=0;t<256;t++) tab[t]=Math.exp(lna*(1+ratio*t));
    for (let y=0;y<H;y++){
      const o=y*W;
      for (let x=1;x<W;x++){ const a=tab[dh[o+x]]; F[o+x]+=a*(F[o+x-1]-F[o+x]); }
      for (let x=W-2;x>=0;x--){ const a=tab[dh[o+x+1]]; F[o+x]+=a*(F[o+x+1]-F[o+x]); }
    }
    for (let x=0;x<W;x++){
      for (let y=1;y<H;y++){ const p=y*W+x, a=tab[dv[p]]; F[p]+=a*(F[p-W]-F[p]); }
      for (let y=H-2;y>=0;y--){ const p=y*W+x, a=tab[dv[p+W]]; F[p]+=a*(F[p+W]-F[p]); }
    }
  }
}
function gauss(F, W, H, sigma){
  if (sigma<0.3) return;
  const r=Math.max(1,Math.ceil(sigma*3)), k=new Float32Array(2*r+1);
  let s=0;
  for (let i=-r;i<=r;i++){ const v=Math.exp(-i*i/(2*sigma*sigma)); k[i+r]=v; s+=v; }
  for (let i=0;i<k.length;i++) k[i]/=s;
  const T=new Float32Array(W*H);
  for (let y=0;y<H;y++){
    const o=y*W;
    for (let x=0;x<W;x++){
      let a=0;
      for (let i=-r;i<=r;i++){ let xx=x+i; xx=xx<0?0:(xx>=W?W-1:xx); a+=F[o+xx]*k[i+r]; }
      T[o+x]=a;
    }
  }
  for (let x=0;x<W;x++){
    for (let y=0;y<H;y++){
      let a=0;
      for (let i=-r;i<=r;i++){ let yy=y+i; yy=yy<0?0:(yy>=H?H-1:yy); a+=T[yy*W+x]*k[i+r]; }
      F[y*W+x]=a;
    }
  }
}
onmessage=e=>{
  const gray=e.data.gray, W=e.data.W, H=e.data.H, N=W*H;

`;
const DETAIL_SRC = `
function linePass(src, W, H, r, horiz, isMax){
  // van Herk running min/max along rows or columns, window 2r+1
  const N=W*H, out=new Float32Array(N);
  const L=horiz?W:H, M=horiz?H:W;
  const line=new Float32Array(L), F=new Float32Array(L), B=new Float32Array(L);
  const pick=isMax?Math.max:Math.min;
  const w=2*r+1;
  for (let m=0;m<M;m++){
    for (let k=0;k<L;k++) line[k]=horiz?src[m*W+k]:src[k*W+m];
    for (let k=0;k<L;k++)
      F[k]=(k%w===0)?line[k]:pick(F[k-1],line[k]);
    for (let k=L-1;k>=0;k--)
      B[k]=(k===L-1||(k+1)%w===0)?line[k]:pick(B[k+1],line[k]);
    for (let k=0;k<L;k++){
      const lo=k-r, hi=k+r;
      let v;
      if (lo<0) v=F[Math.min(hi,L-1)];
      else if (hi>=L) v=B[lo];
      else v=pick(B[lo],F[hi]);
      out[horiz?m*W+k:k*W+m]=v;
    }
  }
  return out;
}
function diagPass(src, W, H, r, up, isMax){
  // van Herk along diagonals so the tool footprint rounds to an octagon
  const N=W*H, out=new Float32Array(N);
  const pick=isMax?Math.max:Math.min;
  const w=2*r+1;
  const L=Math.min(W,H)+Math.max(W,H);
  const idx=new Int32Array(L), line=new Float32Array(L),
        F=new Float32Array(L), B=new Float32Array(L);
  const starts=[];
  if (!up){                       // direction (1,1): starts on top row + left col
    for (let x=0;x<W;x++) starts.push([x,0]);
    for (let y=1;y<H;y++) starts.push([0,y]);
  } else {                        // direction (1,-1): starts on bottom row + left col
    for (let x=0;x<W;x++) starts.push([x,H-1]);
    for (let y=0;y<H-1;y++) starts.push([0,y]);
  }
  const dy=up?-1:1;
  for (const [sx,sy] of starts){
    let n=0, x=sx, y=sy;
    while (x<W && y>=0 && y<H){ idx[n]=y*W+x; line[n]=src[idx[n]]; n++; x++; y+=dy; }
    if (!n) continue;
    for (let k=0;k<n;k++) F[k]=(k%w===0)?line[k]:pick(F[k-1],line[k]);
    for (let k=n-1;k>=0;k--) B[k]=(k===n-1||(k+1)%w===0)?line[k]:pick(B[k+1],line[k]);
    for (let k=0;k<n;k++){
      const lo=k-r, hi=k+r;
      let v;
      if (lo<0) v=F[Math.min(hi,n-1)];
      else if (hi>=n) v=B[lo];
      else v=pick(B[lo],F[hi]);
      out[idx[k]]=v;
    }
  }
  return out;
}
function crossPass(src, W, H, isMax){
  // 5-point cross min/max: the smallest round-ish tool
  const N=W*H, out=new Float32Array(N);
  const pick=isMax?Math.max:Math.min;
  for (let y=0;y<H;y++){
    const o=y*W;
    for (let x=0;x<W;x++){
      const i=o+x;
      let v=src[i];
      if (x>0) v=pick(v,src[i-1]);
      if (x<W-1) v=pick(v,src[i+1]);
      if (y>0) v=pick(v,src[i-W]);
      if (y<H-1) v=pick(v,src[i+W]);

    }
  }

}
function toolOpen(delta, W, H, shape){
  // a mark exists only where the tool fits inside it; otherwise blank
  let a;
  const N2=W*H;
  const diamond=()=>{                    // cross twice = the L1 diamond r2
    let d=crossPass(delta,W,H,false);
    d=crossPass(d,W,H,false);
    d=crossPass(d,W,H,true);
    d=crossPass(d,W,H,true);

  };
  if (shape==='mid'){                    // halfway between 9px square and 13px diamond
    let s=linePass(delta,W,H,1,true,false);

    s=linePass(s,W,H,1,true,true);

    let o=linePass(delta,W,H,1,true,false);   // touch toward the diamond
    o=linePass(o,W,H,1,false,false);
    o=diagPass(o,W,H,1,false,false);
    o=diagPass(o,W,H,1,true,false);
    o=diagPass(o,W,H,1,true,true);
    o=diagPass(o,W,H,1,false,true);
    o=linePass(o,W,H,1,false,true);
    o=linePass(o,W,H,1,true,true);
    const d=diamond();
    a=new Float32Array(N2);
    for (let i=0;i<N2;i++) a[i]=o[i]*0.75+d[i]*0.25;

}

  }

};

function applyLevels(){

  // highlights/darks -> black/white points. Default is the raw photo.

  g.drawImage($('refImg'), gx, gy, gw, gh);
  g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,0.9)'; g.lineWidth=2; g.setLineDash([8,8]);
  g.strokeRect(gx,gy,gw,gh);
  g.setLineDash([]);
  CAM.ghost={vx,vy,vs,gx,gy,gw,gh};
}
async function camStart(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'},
              width:{ideal:4096}, height:{ideal:4096} },
      audio:false });
    CAM.stream=st;
    const v=$('camVid'); v.srcObject=st; v.style.display='block';
    $('cmpShoot').style.display='none';
    $('lvRow').style.display='none';
    $('cmpSplit').style.display='none';
    $('lvBtn').style.display='none';
    $('cmpCorn').style.display='none';
    $('shutter').style.display='block';
    $('cmpBack').textContent='Cancel';
    $('cmpFlip').disabled=true; $('cmpCorn').disabled=true;
    $('cmpHint').textContent='line your drawing up with the ghost, then capture';
    clearInterval(CAM.timer); CAM.timer=setInterval(camGhost,250);
    camGhost();
    // the last photo waits in the corner - tap it to skip reshooting
    const ls=$('lastShot');
    if (CMP.img && CMP.ckey===CKEY){
      ls.width=72; ls.height=Math.round(72*CMP.img.height/CMP.img.width);
      ls.getContext('2d').drawImage(CMP.img,0,0,ls.width,ls.height);
      ls.style.display='block';
    } else ls.style.display='none';
    return true;
  }catch(e){ return false; }
}
function camStop(){
  if (CAM.stream){ for (const t of CAM.stream.getTracks()) t.stop(); CAM.stream=null; }
  clearInterval(CAM.timer); CAM.timer=0; CAM.ghost=null;
  const gg=$('camGhost'); gg.getContext('2d').clearRect(0,0,gg.width,gg.height);
  const v=$('camVid'); v.srcObject=null; v.style.display='none';
  $('shutter').style.display='none';
  $('lastShot').style.display='none';
  $('cmpShoot').style.display='';
  $('cmpBack').textContent='Back';
  $('cmpFlip').disabled=!CMP.img;
}
$('cmpBack').onclick = () => {
  if (CAM.stream){ camStop(); cmpRender(); return; }
  show('scrMain');
};
async function camCapture(){
  const v=$('camVid');
  if (!CAM.stream || !v.videoWidth) return;
  camGhost();                              // mapping current at the shutter
  const gh=CAM.ghost;
  const vw0=v.videoWidth, vh0=v.videoHeight;
  // full-resolution still where the platform offers one (the photo sensor
  // usually far outresolves the video stream); video frame otherwise
  let frame=v, fw=vw0, fh=vh0;
  try{
    if (window.ImageCapture){
      const ic=new ImageCapture(CAM.stream.getVideoTracks()[0]);
      const blob=await Promise.race([ ic.takePhoto(),
        new Promise(r=>setTimeout(()=>r(null),900)) ]);
      if (blob){
        const bmp=await createImageBitmap(blob);
        // trust the still only if it frames like the stream
        if (Math.abs(Math.log((bmp.width/bmp.height)/(fw/fh)))<0.02
            && bmp.width>=fw){ frame=bmp; fw=bmp.width; fh=bmp.height; }
        else bmp.close && bmp.close();
      }
    }
  }catch(e){}
  // keep the WHOLE frame: the ghost rectangle is only the default crop, and
  // the Crop screen can refine it afterwards with the surroundings intact
  const k=Math.min(1, 2400/Math.max(fw,fh));
  const full=document.createElement('canvas');
  full.width=Math.max(2,Math.round(fw*k)); full.height=Math.max(2,Math.round(fh*k));
  const fg=full.getContext('2d');
  fg.imageSmoothingQuality='high';
  fg.filter='grayscale(1)'; fg.drawImage(frame,0,0,full.width,full.height); fg.filter='none';
  if (frame!==v && frame.close) frame.close();
  camStop();
  let blob=null;
  try{ blob=canvasBlob(full,'image/jpeg',0.92); }catch(e){}
  CMP.raw=full; CMP.blob=blob; CMP.framed=true; CMP.cGrab=null;
  if (gh){
    const kx=full.width/vw0, ky=full.height/vh0;
    const x0=(gh.gx-gh.vx)/gh.vs*kx, y0=(gh.gy-gh.vy)/gh.vs*ky;
    const x1=x0+gh.gw/gh.vs*kx, y1=y0+gh.gh/gh.vs*ky;
    CMP.corners=[{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}];
  } else {
    CMP.corners=[{x:0,y:0},{x:full.width,y:0},
                 {x:full.width,y:full.height},{x:0,y:full.height}];
  }
  cmpApplyCorners('flip');
}
$('shutter').onclick = camCapture;
$('cmpShoot').onclick = async () => {
  if (CAM.stream){ camCapture(); return; }
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && await camStart()))
    $('cmpFile').click();
};
$('cmpFile').addEventListener('change', e => {
  const f=e.target.files[0]; if (f) cmpSetPhoto(f);
  e.target.value='';
});
$('cmpFlip').onclick = () => {
  if (CMP.mode==='corners') cmpApplyCorners('flip');
};
$('cmpCorn').onclick = () => {
  if (!CMP.raw) return;
  CMP.mode='corners'; CMP.cGrab=null;
  cmpRender();
};
$('cmpSeam').onclick = () => {
  if (!CMP.img) return;
  if (CMP.mode==='seam'){ CMP.mode='flip'; CMP.showing='photo'; }
  else { CMP.mode='seam'; SEAM.x=0; SEAM.y=0; SEAM.s=1; clampSeam(); }
  cmpRender();
};
$('cmpSplit').onclick = () => {
  if (!CMP.img) return;
  if (CMP.mode==='split'){ CMP.mode='flip'; CMP.showing='photo'; }
  else { CMP.mode='split'; clampSplit(); }
  cmpRender();
};
{
  const cv=$('cmpCv'), pts=new Map(); let g0=null, tap=null;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (pts.size===1) tap={x:e.clientX, y:e.clientY, moved:false, t:Date.now()};
    if (CMP.mode==='corners' && CMP.raw && pts.size===1 && CMP.cfit){
      const r=cv.getBoundingClientRect(), kd=cv.width/r.width,
            px=(e.clientX-r.left)*kd, py=(e.clientY-r.top)*kd;
      let best=-1, bd=36*kd;
      CMP.corners.forEach((q,i2)=>{
        const dd=Math.hypot(CMP.cfit.ox+q.x*CMP.cfit.s-px, CMP.cfit.oy+q.y*CMP.cfit.s-py);
        if (dd<bd){ bd=dd; best=i2; } });
      CMP.cGrab = best>=0 ? best : null;
    }
    if (pts.size===2){
      const [a,b]=[...pts.values()], r=cv.getBoundingClientRect(), kd=cv.width/r.width;
      g0={d:Math.hypot(a.x-b.x,a.y-b.y), ang:Math.atan2(b.y-a.y,b.x-a.x),
          mx:((a.x+b.x)/2-r.left)*kd, my:((a.y+b.y)/2-r.top)*kd,
          spl:{...SPL}, sm:{...SEAM}};
      tap=null; CMP.cGrab=null;
    }
  });
  cv.addEventListener('pointermove', e => {
    const p=pts.get(e.pointerId); if (!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.x=e.clientX; p.y=e.clientY;
    if (Math.hypot(dx,dy)>4 && tap) tap.moved=true;
    const kd=cv.width/cv.getBoundingClientRect().width;   // css px -> canvas px
    if (CMP.mode==='corners' && CMP.raw){
      if (pts.size===1 && CMP.cGrab!=null && CMP.cfit){
        const q=CMP.corners[CMP.cGrab];
        q.x=Math.max(0,Math.min(CMP.raw.width,  q.x+dx*kd/CMP.cfit.s));
        q.y=Math.max(0,Math.min(CMP.raw.height, q.y+dy*kd/CMP.cfit.s));
        cmpRender();
      }
      return;
    }
    if (CMP.mode==='seam' && CMP.img){
      if (pts.size===1){
        SEAM.x+=dx*kd; SEAM.y+=dy*kd; clampSeam(); cmpRender();
      } else if (pts.size===2 && g0){
        const [a,b]=[...pts.values()], r=cv.getBoundingClientRect();
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        const mx=((a.x+b.x)/2-r.left)*kd, my=((a.y+b.y)/2-r.top)*kd;
        const k=Math.max(1,Math.min(16,g0.sm.s*d/g0.d))/g0.sm.s;
        SEAM.s=g0.sm.s*k;
        SEAM.x=mx-(g0.mx-g0.sm.x)*k;
        SEAM.y=my-(g0.my-g0.sm.y)*k;
        clampSeam(); cmpRender();
      }
      return;
    }
    if (CMP.mode==='split' && CMP.img){
      // one shared view: a gesture on either pane moves both together
      const pw=cv.width/2;
      if (pts.size===1){
        SPL.x+=dx*kd; SPL.y+=dy*kd; clampSplit(); cmpRender();
      } else if (pts.size===2 && g0){
        const [a,b]=[...pts.values()], r=cv.getBoundingClientRect();
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        const mx=((a.x+b.x)/2-r.left)*kd, my=((a.y+b.y)/2-r.top)*kd;
        const paneOff=g0.mx>=pw ? pw : 0;
        const k=Math.max(1,Math.min(16,g0.spl.s*d/g0.d))/g0.spl.s;
        SPL.s=g0.spl.s*k;
        SPL.x=(mx-paneOff)-((g0.mx-paneOff)-g0.spl.x)*k;
        SPL.y=my-(g0.my-g0.spl.y)*k;
        clampSplit(); cmpRender();
      }
      return;
    }
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if (pts.size<2) g0=null;
    if (pts.size===0) CMP.cGrab=null;
    if (pts.size===0 && tap && !tap.moved && Date.now()-tap.t<400
        && CMP.mode==='flip' && CMP.img){
      CMP.showing = CMP.showing==='ref' ? 'photo' : 'ref'; cmpRender();
    }
    if (pts.size===0) tap=null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    if (!CMP.img) return;
    if (CMP.mode==='seam'){
      e.preventDefault();
      const r=cv.getBoundingClientRect(), kd=cv.width/r.width;
      const px=(e.clientX-r.left)*kd, py=(e.clientY-r.top)*kd;
      const k=e.deltaY<0?1.08:1/1.08;
      const ns=Math.max(1,Math.min(16,SEAM.s*k)), kk=ns/SEAM.s;
      SEAM.s=ns;
      SEAM.x=px-(px-SEAM.x)*kk; SEAM.y=py-(py-SEAM.y)*kk;
      clampSeam(); cmpRender();
      return;
    }
    if (CMP.mode==='split'){
      e.preventDefault();
      const r=cv.getBoundingClientRect(), pw=cv.width/2, kd=cv.width/r.width;
      let px=(e.clientX-r.left)*kd; const py=(e.clientY-r.top)*kd;
      if (px>=pw) px-=pw;                 // pane-local zoom point
      const k=e.deltaY<0?1.08:1/1.08;
      const ns=Math.max(1,Math.min(16,SPL.s*k)), kk=ns/SPL.s;
      SPL.s=ns;
      SPL.x=px-(px-SPL.x)*kk; SPL.y=py-(py-SPL.y)*kk;
      clampSplit(); cmpRender();
      return;
    }
  }, {passive:false});
  addEventListener('resize', ()=>{ if ($('scrCompare').classList.contains('on')){ cmpSize(); cmpRender(); } });
}

// the tool panel collapses to a corner button for a clear view of the drawing
{
  const hud = $('hud'), tg = $('hudToggle');
  const set = o => {
    hud.style.display = o ? '' : 'none';
    tg.textContent = o ? '▾' : '✎';   // open: collapse arrow; closed: pencil
    try { localStorage.setItem('hudOpen', o ? '1' : '0'); } catch(e){}
    // the open panel is the layer workshop: it starts from the bare
    // shading with every layer unselected; closing returns the full view
    LAYERS.dk=LAYERS.lt=LAYERS.hl=!o;
    layerButtons();
    if (GRID_READY && state.img) viewRepaint();
  };
  let open = true;
  try { open = localStorage.getItem('hudOpen') !== '0'; } catch(e){}
  set(open);
  tg.onclick = () => set(hud.style.display === 'none');
}

// app shell: fullscreen toggle + installable offline PWA
{
  const el = document.documentElement;
  const canFs = el.requestFullscreen || el.webkitRequestFullscreen;
  const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches
    || navigator.standalone === true;
  document.querySelectorAll('.fsBtn').forEach(b => {
    if (!canFs || standalone){ b.style.display='none'; return; }
    b.onclick = () => {
      if (document.fullscreenElement || document.webkitFullscreenElement){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    };
  });
  const fsMark = () => document.querySelectorAll('.fsBtn').forEach(b =>
    b.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? '&#x2716;' : '&#x26F6;');
  document.addEventListener('fullscreenchange', fsMark);
  document.addEventListener('webkitfullscreenchange', fsMark);
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
