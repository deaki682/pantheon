plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'app.realism.draw'
  compileSdk 36

  defaultConfig {
    applicationId "app.realism.draw"
    minSdk 26
    targetSdk 36
    versionCode 48
    versionName "0.9.13"
  }
  // the web app IS the app: the android module serves ../draw verbatim
  sourceSets.main.assets.srcDirs += rootProject.file('../draw')
  // release signing identity: android/release.keystore + keystore.properties.
  // NEVER lose or regenerate that keystore - every future update must be
  // signed with it. Back both files up somewhere safe.
  def ksProps = new Properties()
  def ksFile = rootProject.file('keystore.properties')
  if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
  signingConfigs {
    if (ksFile.exists()) {
      release {
        storeFile rootProject.file(ksProps['storeFile'])
        storePassword ksProps['storePassword']
        keyAlias ksProps['keyAlias']
        keyPassword ksProps['keyPassword']
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (ksFile.exists()) signingConfig signingConfigs.release
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.webkit:webkit:1.11.0'
  def camerax = '1.5.3'
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  implementation "androidx.camera:camera-extensions:$camerax"
}
