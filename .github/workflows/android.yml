# Android release bundle. Every push that changes the app (the web app IS
# the app - android/ serves ../draw verbatim) builds the signed .aab and
# the deployable web zip, and attaches both to a release tagged by the
# Android versionCode so they can be fetched by URL from anywhere.
# Nothing here uploads to Play: that stays a human's hand in the Console.
# The signing identity lives ONLY in repo secrets, never in the tree:
#   ANDROID_KEYSTORE_B64  the release.keystore file, base64
#   ANDROID_KEYSTORE_PASS the store password
#   ANDROID_KEY_ALIAS     the key alias (realism)
#   ANDROID_KEY_PASS      the key password
# The build writes them to android/ for the length of the job and no
# further; a local build puts the same two files there by hand.
name: Android build
on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/**']
    paths:
      - 'android/**'
      - 'draw/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # no wrapper is checked in; pin the same Gradle a local build uses
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Read versions
        id: v
        run: |
          code=$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          name=$(sed -n 's/^ *versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)
          web=$(sed -n 's/.*id="verNum">v\([0-9]*\)<.*/\1/p' draw/index.html)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "web=$web"   >> "$GITHUB_OUTPUT"
          echo "android $code ($name), web v$web"
      - name: Signing identity from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::signing secrets missing - add ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS / ANDROID_KEY_PASS in repo settings"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
      - name: Build the signed release bundle
        run: gradle -p android --no-daemon :app:bundleRelease
      - name: Scrub the signing identity
        if: always()
        run: rm -f android/release.keystore android/keystore.properties
      - name: Package
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "out/realism-${{ steps.v.outputs.code }}.aab"
          (cd draw && zip -qr "../out/draw-v${{ steps.v.outputs.web }}.zip" . \
             -x 'breakdown.py' 'engine-v11-archive.html' 'ARCHIVE.md')
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: realism-android-${{ steps.v.outputs.code }}
          path: out/*
      # a release is the one place a build can be fetched from by plain URL
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.v.outputs.code }}
          name: Android ${{ steps.v.outputs.code }} (${{ steps.v.outputs.name }}) · web v${{ steps.v.outputs.web }}
          body: |
            Signed release bundle for Play, plus the deployable web app.
            Built from ${{ github.sha }} on `${{ github.ref_name }}`.
          files: out/*
          make_latest: true
          fail_on_unmatched_files: true
